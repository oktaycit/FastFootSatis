        function chooseDailyMeal(category) {
            const meals = getDailyMealsForCategory(category);
            if (!meals.length) {
                const typedMeal = prompt(`${category} için yemek çeşidi yazın:`, '');
                if (typedMeal === null) return false;
                const mealName = String(typedMeal || '').trim();
                return mealName ? { yemek: mealName, manual: true } : null;
            }
            const choices = meals.map((meal, index) => {
                const mealStock = getPortionStock(meal.yemek);
                const remaining = Number(mealStock?.kalan ?? meal.kalan ?? meal.porsiyon ?? 0);
                return `${index + 1}) ${meal.yemek} (${formatPortionAmount(remaining)} porsiyon)`;
            }).join('\n');
            const raw = prompt(`${category} çeşidi seçin:\n${choices}`, '1');
            if (raw === null) return false;
            const index = parseInt(raw, 10);
            if (!Number.isNaN(index) && index >= 1 && index <= meals.length) return meals[index - 1];
            const typed = String(raw || '').trim().toLocaleLowerCase('tr-TR');
            return meals.find(meal => String(meal.yemek || '').trim().toLocaleLowerCase('tr-TR') === typed) || null;
        }

        async function addPortionGroupToBasket(name, variants, category = '') {
            let note = '';
            let stockNameOverride = '';

            if (isDailyMealCategory(category)) {
                const selectedMeal = chooseDailyMeal(category);
                if (selectedMeal === false) return;
                if (!selectedMeal) {
                    alert('Geçerli bir günlük yemek çeşidi seçin.');
                    return;
                }
                note = `Yemek: ${selectedMeal.yemek}`;
                stockNameOverride = selectedMeal.manual ? '' : selectedMeal.yemek;
            }

            const selectedVariant = await choosePortionVariant(name, variants);
            if (!selectedVariant) return;

            addToBasket(selectedVariant.item[0], selectedVariant.item[1], category, {
                note,
                stockNameOverride,
                skipDailyMealChoice: isDailyMealCategory(category)
            });
        }

        async function addDailyMealToBasket(meal, variants, category = '') {
            const mealName = String(meal?.yemek || '').trim();
            if (!mealName) return;
            const selectedVariant = await choosePortionVariant(mealName, variants);
            if (!selectedVariant) return;

            addToBasket(selectedVariant.item[0], selectedVariant.item[1], category, {
                note: `Yemek: ${mealName}`,
                stockNameOverride: mealName,
                skipDailyMealChoice: true
            });
        }

        async function addGrillToBasket(grillOrderInfo, category = '') {
            if (!grillOrderInfo || !grillOrderInfo.name) return;
            const variants = GRILL_PORTION_VALUES.map(value => ({
                type: Math.abs(value - 0.5) < 0.001 ? 'half' : (Math.abs(value - 1.5) < 0.001 ? 'onehalf' : 'full'),
                baseName: grillOrderInfo.name,
                synthetic: true,
                item: [
                    value === 1 ? grillOrderInfo.name : `${grillOrderInfo.name} (${formatPortionAmount(value)} porsiyon)`,
                    roundMoney(grillOrderInfo.basePrice * value)
                ]
            }));
            const selectedVariant = await choosePortionVariant(grillOrderInfo.name, variants);
            if (!selectedVariant) return;

            const portionAmount = getPortionVariantUnitMultiplier(selectedVariant);
            addToBasket(grillOrderInfo.name, grillOrderInfo.basePrice, category, {
                quantity: 1,
                portionAmount,
                basePrice: grillOrderInfo.basePrice,
                portionSelectable: true
            });
        }

        function addToBasket(name, price, category = '', options = {}) {
            let note = options.note || '';
            let stockNameOverride = options.stockNameOverride || '';
            const quantity = normalizeBasketQuantity(options.quantity ?? options.adet ?? 1);
            if (!options.skipDailyMealChoice && isDailyMealCategory(category)) {
                const selectedMeal = chooseDailyMeal(category);
                if (selectedMeal === false) return;
                if (!selectedMeal) {
                    alert('Geçerli bir günlük yemek çeşidi seçin.');
                    return;
                }
                note = `Yemek: ${selectedMeal.yemek}`;
                stockNameOverride = selectedMeal.manual ? '' : selectedMeal.yemek;
            }

            const portionAmount = normalizeBasketQuantity(options.portionAmount || 1);
            const basePrice = Number(options.basePrice ?? price ?? 0);
            const nextItem = {
                name,
                price: roundMoney(price),
                basePrice: roundMoney(Number.isFinite(basePrice) ? basePrice : price),
                quantity,
                adet: quantity,
                portionAmount,
                baseNote: note,
                note: options.customNote || '',
                stockName: stockNameOverride,
                category,
                panelId: options.panelId || getPrepPanelForOrderItem(name, category),
                portionSelectable: !!options.portionSelectable
            };

            const mergeIndex = findMergeableBasketItem(nextItem);
            if (mergeIndex >= 0) {
                const mergedItem = {
                    ...basket[mergeIndex],
                    quantity: getBasketQuantity(basket[mergeIndex]) + getBasketQuantity(nextItem)
                };
                mergedItem.adet = mergedItem.quantity;
                const stockError = getBasketStockError(mergedItem, mergeIndex);
                if (stockError) {
                    alert(stockError);
                    return;
                }
                basket[mergeIndex] = mergedItem;
            } else {
                const stockError = getBasketStockError(nextItem);
                if (stockError) {
                    alert(stockError);
                    return;
                }
                basket.push(nextItem);
            }
            if (window.navigator.vibrate) window.navigator.vibrate(50);
            updateBasketDisplay();
        }

        function findMergeableBasketItem(nextItem) {
            return basket.findIndex(item => {
                if ((item.note || '') || (nextItem.note || '')) return false;
                if ((item.baseNote || '') !== (nextItem.baseNote || '')) return false;
                if ((item.stockName || '') !== (nextItem.stockName || '')) return false;
                if ((item.category || '') !== (nextItem.category || '')) return false;
                if ((item.panelId || '') !== (nextItem.panelId || '')) return false;
                if (!!item.portionSelectable !== !!nextItem.portionSelectable) return false;
                if ((item.name || '') !== (nextItem.name || '')) return false;
                if (Math.abs(getBasketPortionAmount(item) - getBasketPortionAmount(nextItem)) > 0.001) return false;
                return Math.abs(getBasketUnitPrice(item) - getBasketUnitPrice(nextItem)) < 0.001;
            });
        }

        function updateBasketNote(index, value) {
            if (!basket[index]) return;
            basket[index].note = value.slice(0, 160);
        }

        function removeFromBasket(index) {
            basket.splice(index, 1);
            updateBasketDisplay();
        }

        function normalizeBasketQuantity(value) {
            const parsed = Number(String(value ?? 1).replace(',', '.'));
            if (!Number.isFinite(parsed) || parsed <= 0) return 1;
            return roundMoney(parsed);
        }

        function getBasketQuantity(item) {
            return normalizeBasketQuantity(item?.quantity ?? item?.adet ?? 1);
        }

        function setBasketQuantity(item, quantity) {
            const nextQuantity = normalizeBasketQuantity(quantity);
            item.quantity = nextQuantity;
            item.adet = nextQuantity;
        }

        function getBasketPortionAmount(item) {
            return normalizeBasketQuantity(item?.portionAmount ?? 1);
        }

        function getBasketUnitPrice(item) {
            if (item?.portionSelectable) {
                const basePrice = Number(item.basePrice ?? item.price ?? 0);
                return roundMoney(Math.max(0, basePrice) * getBasketPortionAmount(item));
            }
            return roundMoney(Number(item?.price || 0));
        }

        function getBasketLineTotal(item) {
            return roundMoney(getBasketQuantity(item) * getBasketUnitPrice(item));
        }

        function getGrillPortionIndex(value) {
            const normalized = normalizeBasketQuantity(value);
            const index = GRILL_PORTION_VALUES.findIndex(portion => Math.abs(portion - normalized) < 0.001);
            if (index !== -1) return index;
            if (normalized <= GRILL_PORTION_VALUES[0]) return 0;
            if (normalized >= GRILL_PORTION_VALUES[GRILL_PORTION_VALUES.length - 1]) {
                return GRILL_PORTION_VALUES.length - 1;
            }
            return 1;
        }

        function adjustBasketQuantity(index, direction) {
            const item = basket[index];
            if (!item) return;
            const currentQuantity = getBasketQuantity(item);
            const nextQuantity = Math.max(1, currentQuantity + direction);
            if (Math.abs(nextQuantity - currentQuantity) < 0.001) return;
            const candidate = { ...item, quantity: nextQuantity, adet: nextQuantity };
            const stockError = getBasketStockError(candidate, index);
            if (stockError) {
                alert(stockError);
                return;
            }
            setBasketQuantity(item, nextQuantity);
            updateBasketDisplay();
        }

        function adjustBasketPortion(index, direction) {
            const item = basket[index];
            if (!item || !item.portionSelectable) return;
            const currentIndex = getGrillPortionIndex(getBasketPortionAmount(item));
            const nextIndex = Math.max(0, Math.min(GRILL_PORTION_VALUES.length - 1, currentIndex + direction));
            const candidate = { ...item, portionAmount: GRILL_PORTION_VALUES[nextIndex] };
            const stockError = getBasketStockError(candidate, index);
            if (stockError) {
                alert(stockError);
                return;
            }
            item.portionAmount = GRILL_PORTION_VALUES[nextIndex];
            item.price = getBasketUnitPrice(item);
            updateBasketDisplay();
        }

        function getBasketSendName(item) {
            if (!item?.portionSelectable) return item?.name || '';
            const amount = getBasketPortionAmount(item);
            const baseName = String(item.name || '').trim();
            if (Math.abs(amount - 0.5) < 0.001) return `Yarım Porsiyon ${baseName}`;
            if (Math.abs(amount - 1) < 0.001) return `Tam Porsiyon ${baseName}`;
            return `${baseName} (${formatPortionAmount(amount)} porsiyon)`;
        }

        function getMealNameFromBaseNote(note) {
            const firstLine = String(note || '').split(/\r?\n/)[0].trim();
            if (!firstLine.startsWith('Yemek:')) return '';
            return firstLine.replace(/^Yemek:\s*/i, '').trim();
        }

        function getPortionLabelFromName(name) {
            const rawName = String(name || '').trim();
            const prefixMatch = rawName.match(/^(tam|yarım|yarim)\s+porsiyon\s+/i);
            if (prefixMatch) {
                return normalizeMenuText(prefixMatch[1]).startsWith('yar') ? 'Yarım Porsiyon' : 'Tam Porsiyon';
            }
            const trailing = rawName.match(/\(\s*(\d+(?:[,.]\d+)?)\s*porsiyon\s*\)\s*$/i);
            if (trailing) {
                const parsed = Number(trailing[1].replace(',', '.'));
                if (Number.isFinite(parsed) && parsed > 0) return formatPortionChoiceLabel(parsed);
            }
            return '';
        }

        function getBasketDisplayName(item) {
            if (item?.portionSelectable) return getBasketSendName(item);
            const mealName = getMealNameFromBaseNote(item?.baseNote);
            if (mealName) {
                const portionLabel = getPortionLabelFromName(item?.name);
                return portionLabel ? `${portionLabel} ${mealName}` : mealName;
            }
            return item?.name || '';
        }

        function getBasketPriceMeta(item) {
            const adet = getBasketQuantity(item);
            const unitPrice = getBasketUnitPrice(item);
            const total = getBasketLineTotal(item);
            if (Math.abs(adet - 1) < 0.001) return `${formatMenuPrice(unitPrice)} TL`;
            return `${formatMenuPrice(unitPrice)} TL x ${formatPortionAmount(adet)} = ${formatMenuPrice(total)} TL`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function getPaketLabels() {
            if (Object.prototype.hasOwnProperty.call(sysInfo, 'paket_labels')) {
                return Array.isArray(sysInfo.paket_labels)
                    ? sysInfo.paket_labels.map(label => String(label || '').trim()).filter(Boolean)
                    : [];
            }

            const paketCount = Number(sysInfo.paket_sayisi || 0);
            return Array.from({ length: Math.max(0, paketCount) }, (_, index) => `Paket ${index + 1}`);
        }

        function getPaketDisplayLabel(label) {
            const match = String(label || '').trim().match(/^Paket\s+(\d+)$/i);
            return match ? `P${match[1]}` : label;
        }

        function isMenuItemVisible(item) {
            if (!Array.isArray(item) || item.length <= 7) return true;
            const value = item[7];
            if (typeof value === 'boolean') return value;
            return !['0', 'false', 'hayir', 'hayır', 'no', 'off'].includes(String(value).trim().toLowerCase());
        }

        function getPortionStock(name) {
            const stockName = getPortionStockName(name);
            return portionStock[stockName] || portionStock[String(name || '').trim()] || null;
        }

        function getPortionStockName(name) {
            return String(name || '')
                .trim()
                .replace(/^(tam|yarım|yarim)\s+porsiyon\s+/i, '')
                .replace(/\(\s*\d+(?:[,.]\d+)?\s*porsiyon\s*\)\s*$/i, '')
                .trim();
        }

        function getPortionMultiplierFromName(name) {
            const normalized = String(name || '').trim().toLocaleLowerCase('tr-TR');
            if (/^(yarım|yarim)\s+porsiyon\s+/.test(normalized)) return 0.5;
            const trailing = String(name || '').trim().match(/\(\s*(\d+(?:[,.]\d+)?)\s*porsiyon\s*\)\s*$/i);
            if (trailing) {
                const parsed = Number(trailing[1].replace(',', '.'));
                if (Number.isFinite(parsed) && parsed > 0) return parsed;
            }
            return 1;
        }

        function getPortionUnits(name, adet = 1) {
            return Number(adet || 1) * getPortionMultiplierFromName(name);
        }

        function getBasketPortionUnits(item) {
            const quantity = getBasketQuantity(item);
            if (item?.portionSelectable) {
                return quantity * getBasketPortionAmount(item);
            }
            return getPortionUnits(item?.name, quantity);
        }

        function formatPortionAmount(value) {
            const amount = Number(value || 0);
            return Number.isInteger(amount) ? String(amount) : String(amount).replace('.', ',');
        }

        function shouldCheckBasketItemStock(item) {
            return !!item?.stockName || isDailyMealCategory(item?.category);
        }

        function getBasketItemStockName(item) {
            if (!shouldCheckBasketItemStock(item)) return '';
            return item.stockName || getPortionStockName(item.name);
        }

        function getBasketStockError(candidate, candidateIndex = -1) {
            const stockName = getBasketItemStockName(candidate);
            if (!stockName) return '';
            const stock = getPortionStock(stockName);
            if (!stock || !stock.tracked) return '';

            const remaining = Number(stock.kalan || 0);
            if (remaining <= 0) return `${stock.urun || stockName} tükendi`;

            const alreadyInBasket = basket.reduce((sum, item, index) => {
                if (index === candidateIndex) return sum;
                if (getBasketItemStockName(item) !== stockName) return sum;
                return sum + getBasketPortionUnits(item);
            }, 0);
            const requestedUnits = getBasketPortionUnits(candidate);
            if (alreadyInBasket + requestedUnits > remaining + 0.001) {
                return `${stock.urun || stockName} için sadece ${formatPortionAmount(remaining)} porsiyon kaldı`;
            }
            return '';
        }

        function canSendBasket() {
            const counts = {};
            basket.forEach(item => {
                const stockName = getBasketItemStockName(item);
                if (!stockName) return;
                counts[stockName] = (counts[stockName] || 0) + getBasketPortionUnits(item);
            });
            for (const [name, adet] of Object.entries(counts)) {
                const stock = getPortionStock(name);
                if (!stock || !stock.tracked) continue;
                const remaining = Number(stock.kalan || 0);
                if (remaining <= 0) {
                    alert(`${stock.urun || name} tükendi`);
                    return false;
                }
                if (adet > remaining + 0.001) {
                    alert(`${stock.urun || name} için sadece ${formatPortionAmount(remaining)} porsiyon kaldı`);
                    return false;
                }
            }
            return true;
        }

        function updateBasketDisplay() {
            const list = document.getElementById('basketList');
            const totalEl = document.getElementById('basketTotal');
            const countEl = document.getElementById('basketCount');
            if (!list) return;
            list.innerHTML = '';
            let total = 0;
            const readyCount = serverItems.filter(isReadyItem).length;
            const servedButton = document.getElementById('btnMarkServed');
            const transferButton = document.getElementById('btnTransferTable');
            if (servedButton) {
                servedButton.style.display = readyCount ? 'inline-flex' : 'none';
                servedButton.textContent = readyCount > 1 ? `SERVİS EDİLDİ (${readyCount})` : 'SERVİS EDİLDİ';
            }
            if (transferButton) {
                transferButton.style.display = currentTable && serverItems.length ? 'inline-flex' : 'none';
            }

            // 1. Aktif Siparişler (Mutfakta/Hazır)
            serverItems.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'basket-item';
                const isIkram = isComplimentaryItem(item);
                let statusBadge = '';
                if (isReadyItem(item)) {
                    statusBadge = '<span style="color: #2ecc71; font-size: 10px; margin-right: 5px; font-weight: bold;">[HAZIR]</span>';
                } else if (isServedItem(item)) {
                    statusBadge = '<span style="color: #95a5a6; font-size: 10px; margin-right: 5px; font-weight: bold;">[SERVİS EDİLDİ]</span>';
                } else {
                    statusBadge = '<span style="color: #f39c12; font-size: 10px; margin-right: 5px; font-weight: bold;">[MUTFAKTA]</span>';
                }
                const itemNote = item.not || '';
                const noteLabel = formatOrderNote(itemNote);
                const quantity = normalizeBasketQuantity(item.adet || 1);
                const serverPriceMeta = Math.abs(quantity - 1) < 0.001
                    ? `${formatMenuPrice(item.fiyat)} TL`
                    : `${formatMenuPrice(item.fiyat)} TL x ${formatPortionAmount(quantity)} = ${formatMenuPrice(getLineTotal(item))} TL`;
                div.innerHTML = `
                    <div style="flex-grow: 1;">
                        ${statusBadge}
                        <span class="basket-item-name">${item.urun}${isIkram ? ' (İKRAM)' : ''}</span>
                        <br/><span class="basket-line-meta">${isIkram ? 'İkram' : serverPriceMeta}</span>
                        ${noteLabel ? `<br/><span class="basket-item-note">${escapeHtml(noteLabel)}</span>` : ''}
                    </div>
                    <div>
                        ${isKitchenCancelableItem(item) ? `<button class="btn-cancel" onclick="cancelItem('${item.uid}')">İPTAL</button>` : ''}
                    </div>
                `;
                list.appendChild(div);
                if (!isIkram) total += getLineTotal(item);
            });

            // 2. Yeni Siparişler (Sepettekiler)
            basket.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'basket-item';
                div.style.borderLeft = '3px solid #3498db';
                const quantity = getBasketQuantity(item);
                const portionIndex = getGrillPortionIndex(getBasketPortionAmount(item));
                const baseNoteLabel = formatOrderNote(item.baseNote || '');
                const quantityControls = `<div class="basket-control-group">
                            <span class="basket-control-label">Adet</span>
                            <div class="quantity-stepper">
                                <button type="button" onclick="adjustBasketQuantity(${index}, -1)" ${quantity <= 1 ? 'disabled' : ''}>-</button>
                                <span>${formatPortionAmount(quantity)}x</span>
                                <button type="button" onclick="adjustBasketQuantity(${index}, 1)">+</button>
                            </div>
                        </div>`;
                const portionControls = item.portionSelectable
                    ? `<div class="basket-control-group">
                            <span class="basket-control-label">Porsiyon</span>
                            <div class="portion-stepper">
                                <button type="button" onclick="adjustBasketPortion(${index}, -1)" ${portionIndex === 0 ? 'disabled' : ''}>-</button>
                                <span>${formatPortionChoiceLabel(GRILL_PORTION_VALUES[portionIndex])}</span>
                                <button type="button" onclick="adjustBasketPortion(${index}, 1)" ${portionIndex === GRILL_PORTION_VALUES.length - 1 ? 'disabled' : ''}>+</button>
                            </div>
                        </div>`
                    : '';
                div.innerHTML = `
                    <div style="flex-grow: 1;">
                        <span style="color: #3498db; font-size: 10px; font-weight: bold;">[YENİ]</span>
                        <span class="basket-item-name">${escapeHtml(getBasketDisplayName(item))}</span>
                        <br/><span class="basket-line-meta">${getBasketPriceMeta(item)}</span>
                        ${baseNoteLabel ? `<br/><span class="basket-item-note">${escapeHtml(baseNoteLabel)}</span>` : ''}
                        <input
                            class="basket-note"
                            type="text"
                            maxlength="160"
                            placeholder="Kalem notu"
                            value="${escapeHtml(item.note || '')}"
                            oninput="updateBasketNote(${index}, this.value)"
                        >
                        <div class="ready-note-buttons"></div>
                    </div>
                    <div class="basket-item-actions">
                        ${quantityControls}
                        ${portionControls}
                        <span class="remove" onclick="removeFromBasket(${index})">×</span>
                    </div>
                `;
                list.appendChild(div);
                appendReadyNoteButtons(div, index, item);
                total += getBasketLineTotal(item);
            });

            if (totalEl) totalEl.textContent = total.toFixed(2) + ' TL';
            if (countEl) countEl.textContent = serverItems.length + basket.length;
        }

        function cancelItem(uid) {
            if (confirm('Bu siparişi iptal etmek istediğinize emin misiniz?')) {
                socket.emit('cancel_item', { masa: currentTable, uid: uid });
            }
        }

        function markReadyItemsServed() {
            if (!currentTable) return;
            const readyItems = getReadyItems(currentTable);
            if (!readyItems.length) return;
            socket.emit('mark_order_served', {
                masa: currentTable,
                garson: loggedWaiter,
                items_uids: readyItems.map(item => item.uid).filter(Boolean)
            });
        }

        function sendOrder() {
            if (!currentTable || basket.length === 0) return;
            if (!canSendBasket()) return;
            basket.forEach(item => {
                socket.emit('add_item', {
                    masa: currentTable, // Masayı açıkça gönder
                    urun: getBasketSendName(item),
                    fiyat: getBasketUnitPrice(item),
                    adet: getBasketQuantity(item),
                    kategori: item.category || '',
                    garson: loggedWaiter,
                    not: composeBasketItemNote(item)
                });
            });
            basket = [];
            updateBasketDisplay();
        }

        function getTransferTableGroups() {
            const salons = Array.isArray(sysInfo.salons) ? sysInfo.salons : [];
            if (salons.length > 0) {
                return salons
                    .map(salon => ({
                        name: salon.name || 'Salon',
                        tables: (salon.tables || []).filter(Boolean)
                    }))
                    .filter(group => group.tables.length > 0);
            }

            const masaCount = Number(sysInfo.masa_sayisi || 0);
            if (!masaCount) return [];
            return [{
                name: 'Masalar',
                tables: Array.from({ length: masaCount }, (_, index) => `Masa ${index + 1}`)
            }];
        }

        function openTransferModal() {
            if (!currentTable) {
                alert('Önce masa seçin');
                return;
            }
            if (basket.length > 0) {
                alert('Masa taşımadan önce sepetteki yeni siparişleri gönderin veya silin.');
                return;
            }
            if (!serverItems.length) {
                alert('Taşınacak aktif sipariş bulunmuyor.');
                return;
            }

            const grid = document.getElementById('transferTargetGrid');
            const sourceInfo = document.getElementById('transferSourceInfo');
            if (!grid) return;
            grid.innerHTML = '';
            if (sourceInfo) {
                sourceInfo.textContent = `Kaynak: ${currentTable} · ${serverItems.length} ürün`;
            }

            let targetCount = 0;
            getTransferTableGroups().forEach(group => {
                const targets = group.tables.filter(table => table !== currentTable);
                if (!targets.length) return;

                const groupTitle = document.createElement('div');
                groupTitle.className = 'transfer-group';
                groupTitle.textContent = group.name;
                grid.appendChild(groupTitle);

                targets.forEach(table => {
                    const items = getTableItems(table);
                    const total = items.reduce((sum, item) => sum + (isComplimentaryItem(item) ? 0 : getLineTotal(item)), 0);
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'transfer-target' + (items.length ? ' occupied' : '');
                    btn.innerHTML = `
                        <span class="transfer-target-name">${escapeHtml(table)}</span>
                        ${items.length ? `<span class="transfer-meta">${items.length} ürün · ${total.toFixed(2)} TL</span>` : '<span class="transfer-meta">Boş</span>'}
                    `;
                    btn.onclick = () => confirmTransfer(table);
                    grid.appendChild(btn);
                    targetCount += 1;
                });
            });

            if (!targetCount) {
                grid.innerHTML = '<div class="transfer-empty">Taşınacak hedef masa bulunamadı.</div>';
            }

            document.getElementById('transferModal').style.display = 'flex';
        }

        function confirmTransfer(targetTable) {
            if (!currentTable || !targetTable) return;
            const targetItems = getTableItems(targetTable);
            const mergeNote = targetItems.length
                ? `\n\n${targetTable} içinde ${targetItems.length} ürün var. Taşıma sonrası hesaplar birleşecek.`
                : '';
            const ok = confirm(`${currentTable} masasını ${targetTable} masasına taşımak istiyor musunuz?${mergeNote}`);
            if (!ok) return;

            pendingTransfer = {
                source: currentTable,
                target: targetTable
            };
            socket.emit('transfer_table', {
                source_masa: currentTable,
                target_masa: targetTable,
                garson: loggedWaiter || 'Ortak Terminal'
            });
            closeTransferModal();
        }

        function closeTransferModal() {
            const modal = document.getElementById('transferModal');
            if (modal) modal.style.display = 'none';
        }

        function handleTransferSuccess(data) {
            const source = data.source_masa || pendingTransfer?.source;
            const target = data.target_masa || pendingTransfer?.target;
            if (!target || (pendingTransfer && target !== pendingTransfer.target)) {
                pendingTransfer = null;
                return;
            }

            currentTable = target;
            basket = [];
            serverItems = getTableItems(target);
            document.getElementById('activeTableName').textContent = target;
            updateActiveTableAlert();
            showScreen('order-screen');
            document.getElementById('basketPanel').style.display = 'flex';
            socket.emit('select_masa', { masa: target });
            renderTables();
            updateBasketDisplay();
            pendingTransfer = null;

            if (source && window.navigator.vibrate) {
                window.navigator.vibrate([80, 40, 80]);
            }
        }

        function openQrTools() {
            if (sharedTerminalMode) {
                alert('Ortak terminalde QR/NFC araçları kapalı.');
                return;
            }
            if (!loggedWaiter) {
                alert('Önce giriş yapın');
                return;
            }
            if (!currentTable) {
                alert('Önce masa seçin');
                return;
            }
            document.getElementById('toolsCurrentTable').textContent = `Masa: ${currentTable}`;
            document.getElementById('toolsModal').style.display = 'flex';
        }

        function closeQrTools() {
            document.getElementById('toolsModal').style.display = 'none';
        }

        async function generateDynamicQr() {
            if (!currentTable) return;
            const kasaId = parseInt(document.getElementById('qrKasaId').value || '1', 10);
            const qrContainer = document.getElementById('qrImageContainer');
            const textInfo = document.getElementById('qrTextInfo');

            qrContainer.innerHTML = '';
            textInfo.textContent = 'Üretiliyor...';

            try {
                const res = await fetch('/api/waiter/table-session/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        table_name: currentTable,
                        kasa_id: kasaId,
                        ttl_seconds: 900,
                        waiter_name: loggedWaiter,
                        waiter_pin: loggedPin
                    })
                });
                const data = await res.json();
                if (!data.success) {
                    qrContainer.innerHTML = '';
                    textInfo.innerHTML = `<span style="color: #e74c3c;">Hata: ${data.error || 'QR üretilemedi'}</span>`;
                    return;
                }

                const fullUrl = window.location.origin + data.verify_url;

                // QR kod görselini oluştur
                const canvas = document.createElement('canvas');
                canvas.style.borderRadius = '8px';
                canvas.style.background = '#fff';
                canvas.style.padding = '8px';
                qrContainer.appendChild(canvas);

                QRCode.toCanvas(canvas, fullUrl, {
                    width: 180,
                    margin: 2,
                    color: {
                        dark: '#000000',
                        light: '#ffffff'
                    }
                }, function (error) {
                    if (error) {
                        qrContainer.innerHTML = '<span style="color: #e74c3c;">QR oluşturulamadı</span>';
                        textInfo.textContent = fullUrl;
                        return;
                    }
                });

                // Alt bilgi
                const expireDate = new Date(data.expires_at_unix * 1000);
                const expireTime = expireDate.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                textInfo.innerHTML = `
                    <div style="margin-top: 8px; color: #2ecc71; font-weight: bold;">✓ QR Oluşturuldu</div>
                    <div style="margin-top: 4px;"><strong>${currentTable}</strong> - ${expireTime}'ya kadar geçerli</div>
                    <div style="margin-top: 4px; font-size: 10px; word-break: break-all; color: #666;">${fullUrl}</div>
                `;
            } catch (e) {
                qrContainer.innerHTML = '';
                textInfo.innerHTML = `<span style="color: #e74c3c;">Hata: Sunucuya erişilemedi</span>`;
            }
        }

        async function readNfcForRegister() {
            const out = document.getElementById('nfcOutput');
            if (!('NDEFReader' in window)) {
                out.textContent = 'Bu cihaz/tarayıcı Web NFC desteklemiyor.';
                return;
            }
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                out.textContent = 'NFC bekleniyor...';
                ndef.onreading = (event) => {
                    const serial = event.serialNumber || '';
                    if (serial) {
                        document.getElementById('nfcUidInput').value = serial;
                        out.textContent = 'NFC UID okundu.';
                    } else {
                        out.textContent = 'NFC seri no okunamadı.';
                    }
                };
            } catch (e) {
                out.textContent = 'NFC okuma başlatılamadı.';
            }
        }

        async function registerNfcTag() {
            if (!currentTable) return;
            const uid = (document.getElementById('nfcUidInput').value || '').trim();
            const out = document.getElementById('nfcOutput');
            if (!uid) {
                out.textContent = 'NFC UID gerekli.';
                return;
            }
            out.textContent = 'Kaydediliyor...';
            try {
                const res = await fetch('/api/waiter/nfc-tag/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        table_name: currentTable,
                        nfc_uid: uid,
                        waiter_name: loggedWaiter,
                        waiter_pin: loggedPin
                    })
                });
                const data = await res.json();
                if (!data.success) {
                    out.textContent = `Hata: ${data.error || 'Kayıt başarısız'}`;
                    return;
                }
                out.textContent = `${data.table_name} için NFC kaydedildi.`;
            } catch (e) {
                out.textContent = 'Hata: Sunucuya erişilemedi.';
            }
        }

    </script>

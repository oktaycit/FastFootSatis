<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Restoran - Garson Arayüzü</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-light: #f5f5f5;
            --app-height: 100vh;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        @supports (height: 100dvh) {
            :root {
                --app-height: 100dvh;
            }
        }

        html {
            height: 100%;
            background-color: var(--bg-dark);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: var(--app-height);
            min-height: -webkit-fill-available;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: var(--app-height);
            min-height: 0;
            overflow: hidden;
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
        }

        select,
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        .top-bar {
            background-color: var(--secondary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            z-index: 100;
            flex-shrink: 0;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 18px;
            color: var(--primary);
        }

        .btn-tools {
            background: #16a085;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-tools.dim-toggle {
            width: 38px;
            min-width: 38px;
            padding: 8px 0;
            background: #263445;
        }

        .terminal-mode-chip {
            display: none;
            color: #d6e4f0;
            background: #263445;
            border: 1px solid #3b4a5e;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        body.shared-terminal .terminal-mode-chip {
            display: inline-flex;
        }

        body.shared-terminal .btn-tools.qr-tools {
            display: none;
        }

        .selected-table-info {
            font-weight: bold;
            background: #34495e;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .selected-table-info.order-ready {
            background: #f1c40f;
            color: #111;
            box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.22);
            animation: readyPulse 1.3s ease-in-out infinite;
        }

        .viewport {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 15px;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn-item {
            aspect-ratio: 1/1;
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px;
            font-weight: 500;
        }

        .btn-item:active {
            transform: scale(0.95);
            background: #2c3e50;
        }

        .btn-item.order-ready {
            background: #f1c40f;
            border-color: #fff3a6;
            color: #111;
            box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.2), 0 0 22px rgba(241, 196, 15, 0.32);
            animation: readyPulse 1.3s ease-in-out infinite;
        }

        .table-ready-badge {
            margin-top: 6px;
            padding: 3px 7px;
            border-radius: 999px;
            background: #111;
            color: #f1c40f;
            font-size: 10px;
            font-weight: 800;
        }

        @keyframes readyPulse {
            0%, 100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.18);
            }
        }

        .btn-item .price {
            font-size: 12px;
            color: var(--success);
            margin-top: 5px;
        }

        .btn-item .item-name {
            font-size: 13px;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        .btn-item .portion-price-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: var(--success);
            font-size: 11px;
            line-height: 1.2;
            margin-top: 5px;
        }

        .btn-item.sold-out {
            opacity: 0.55;
            border-color: #5c2f2f;
            background: #2a1717;
            cursor: not-allowed;
        }

        .btn-item.low-stock {
            border-color: #f39c12;
        }

        .portion-badge {
            margin-top: 6px;
            padding: 3px 7px;
            border-radius: 999px;
            background: #263445;
            color: #d7ecff;
            font-size: 10px;
            font-weight: 800;
        }

        .portion-badge.low {
            background: #4a3513;
            color: #ffd58a;
        }

        .portion-badge.empty {
            background: #5c1f1f;
            color: #ffb4b4;
        }

        .grill-portion-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: var(--success);
            font-size: 11px;
            line-height: 1.2;
            margin-top: 5px;
        }

        .basket-line-meta {
            font-size: 10px;
            color: #999;
        }

        .basket-control-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: stretch;
        }

        .basket-control-label {
            color: #94a3b8;
            font-size: 9px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            text-align: center;
        }

        .portion-stepper,
        .quantity-stepper {
            display: grid;
            grid-template-columns: 30px minmax(54px, 1fr) 30px;
            gap: 5px;
            align-items: center;
            min-width: 124px;
            margin-top: 2px;
        }

        .portion-stepper button,
        .quantity-stepper button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 8px;
            background: #2f3542;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
        }

        .portion-stepper button:disabled,
        .quantity-stepper button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .portion-stepper span,
        .quantity-stepper span {
            min-height: 30px;
            border-radius: 8px;
            background: #101820;
            color: #d7ecff;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            white-space: nowrap;
        }

        .portion-select-modal {
            position: fixed;
            inset: 0;
            z-index: 2200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.68);
        }

        .portion-select-card {
            width: 100%;
            max-width: 420px;
            background: #171717;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.48);
        }

        .portion-select-title {
            color: #f5f5f5;
            font-size: 18px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 12px;
            text-align: center;
        }

        .portion-select-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .portion-select-btn {
            min-height: 82px;
            border: 1px solid #2f3542;
            border-radius: 10px;
            background: #222;
            color: #fff;
            padding: 12px 8px;
            font-weight: 800;
            cursor: pointer;
        }

        .portion-select-btn:active {
            transform: scale(0.98);
            background: #2c3e50;
        }

        .portion-select-label {
            display: block;
            font-size: 16px;
            line-height: 1.2;
        }

        .portion-select-price {
            display: block;
            color: var(--success);
            font-size: 13px;
            margin-top: 6px;
        }

        .portion-select-cancel {
            width: 100%;
            margin-top: 10px;
            min-height: 42px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #ddd;
            font-weight: 800;
            cursor: pointer;
        }

        .category-tabs {
            display: flex;
            overflow-x: auto;
            gap: 7px;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            min-height: 38px;
            padding: 8px 13px;
            background: #222;
            border-radius: 18px;
            white-space: nowrap;
            font-size: 13px;
            border: 1px solid #333;
            font-weight: 700;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .basket-panel {
            background: #1a1a1a;
            border-top: 2px solid #333;
            padding: 15px 15px calc(15px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            max-height: 40vh;
            flex: 0 0 auto;
            box-sizing: border-box;
        }

        .basket-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .basket-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }

        .basket-item-note {
            display: inline-block;
            margin-top: 4px;
            color: #f1c40f;
            font-size: 11px;
            line-height: 1.35;
        }

        .basket-note {
            width: 100%;
            margin: 7px 0 0;
            padding: 9px 10px;
            background: #111;
            border: 1px solid #2f3542;
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .ready-note-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 7px;
        }

        .ready-note-btn {
            min-height: 30px;
            border: 1px solid #34445a;
            border-radius: 8px;
            background: #202733;
            color: #dbeafe;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .ready-note-btn.active {
            border-color: #f1c40f;
            background: #4a3513;
            color: #ffe08a;
        }

        .basket-item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            min-height: 28px;
        }

        .basket-item .remove {
            color: var(--danger);
            font-size: 20px;
            padding: 0 10px;
            cursor: pointer;
        }

        .basket-footer {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 0 0 auto;
            flex-wrap: wrap;
        }

        .total {
            flex-grow: 1;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-send {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            min-height: 48px;
            white-space: nowrap;
        }

        .btn-served {
            background: #f1c40f;
            color: #111;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            min-height: 48px;
            white-space: nowrap;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .btn-served:active {
            transform: scale(0.98);
        }

        .btn-transfer-table {
            background: #d97706;
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            min-height: 48px;
            white-space: nowrap;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .btn-transfer-table:active {
            transform: scale(0.98);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .badge {
            background: var(--danger);
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            margin-left: 5px;
        }

        .btn-cancel {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .tools-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .tools-card {
            width: 100%;
            max-width: 640px;
            background: #171717;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tools-box {
            background: #202020;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
        }

        .tools-box h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #8bd3ff;
        }

        .tools-box button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-primary {
            background: #3498db;
            color: #fff;
        }

        .btn-ok {
            background: #2ecc71;
            color: #fff;
        }

        .tools-output {
            margin-top: 10px;
            background: #0d1117;
            border: 1px solid #2f3542;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            color: #d0d7de;
            word-break: break-all;
            min-height: 40px;
        }

        .tools-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .transfer-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.68);
            z-index: 2150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .transfer-card {
            width: 100%;
            max-width: 520px;
            max-height: min(78vh, 720px);
            background: #171717;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .transfer-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .transfer-title {
            font-size: 18px;
            font-weight: 900;
            color: #f5f5f5;
        }

        .transfer-source {
            margin-top: 4px;
            font-size: 12px;
            color: #b7c0cc;
        }

        .transfer-close {
            width: 38px;
            min-width: 38px;
            height: 38px;
            border: none;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        .transfer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
            gap: 9px;
            overflow-y: auto;
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .transfer-group {
            grid-column: 1 / -1;
            padding: 8px 2px 2px;
            color: #8bd3ff;
            font-size: 12px;
            font-weight: 900;
            border-bottom: 1px solid #2b3440;
        }

        .transfer-target {
            min-height: 72px;
            border: 1px solid #2f3542;
            border-radius: 8px;
            background: #202020;
            color: #fff;
            padding: 8px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
        }

        .transfer-target.occupied {
            border-color: #d97706;
            background: #2b2115;
        }

        .transfer-target:active {
            transform: scale(0.98);
            background: #2c3e50;
        }

        .transfer-target-name {
            display: block;
            font-size: 15px;
            line-height: 1.2;
        }

        .transfer-meta {
            display: block;
            margin-top: 5px;
            color: #fbbf24;
            font-size: 11px;
            line-height: 1.2;
        }

        .transfer-empty {
            grid-column: 1 / -1;
            color: #a8b3bf;
            padding: 18px 4px;
            text-align: center;
        }

        @media (max-width: 720px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }

        body.low-light {
            --primary: #1d5f86;
            --secondary: #111827;
            --success: #1f8a54;
            --danger: #b43b35;
            --bg-dark: #050607;
            --panel-bg: #101316;
            --text-light: #e5e7eb;
        }

        body.low-light .top-bar,
        body.low-light .basket-panel {
            background: #0b1015;
            border-color: #202a35;
            box-shadow: none;
        }

        body.low-light .login-box,
        body.low-light .btn-item,
        body.low-light .tab,
        body.low-light .tools-card,
        body.low-light .portion-select-card {
            background: #101316;
            border-color: #242c36;
            box-shadow: none;
        }

        body.low-light .btn-item:active {
            background: #17212b;
        }

        body.low-light .btn-send {
            background: #1f7a4d;
        }

        body.low-light .btn-transfer-table {
            background: #8a4f12;
        }

        body.low-light .transfer-card,
        body.low-light .transfer-target {
            background: #101316;
            border-color: #242c36;
            box-shadow: none;
        }

        body.low-light .transfer-target.occupied {
            background: #201914;
            border-color: #8a4f12;
        }

        body.low-light .ready-note-btn {
            background: #161d25;
            border-color: #283341;
            color: #cbd5e1;
        }

        body.low-light .ready-note-btn.active {
            background: #332612;
            border-color: #9f7d24;
            color: #f5d37a;
        }

        body.low-light .btn-served,
        body.low-light .btn-item.order-ready,
        body.low-light .selected-table-info.order-ready {
            animation: none;
            box-shadow: 0 0 0 2px rgba(184, 134, 11, 0.18);
            filter: none;
        }

    </style>
</head>

<body>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const shared = window.location.pathname.includes('garson-terminal')
                || window.location.pathname.includes('/waiter/shared')
                || params.get('shared') === '1'
                || params.get('mode') === 'shared';
            if (shared) document.body.classList.add('shared-terminal');
            if (localStorage.getItem('waiter_low_light') !== 'normal') {
                document.body.classList.add('low-light');
            }
        })();
    </script>
    <!-- Login Screen -->
    <div id="loginOverlay" class="login-screen">
        <div class="login-box">
            <h2>Garson Girişi</h2>
            <select id="loginWaiterSelect">
                <option value="">İsminizi Seçin</option>
            </select>
            <input type="password" id="loginPin" placeholder="PIN Kodunuz" pattern="\d*">
            <button class="btn-login" onclick="attemptLogin()">GİRİŞ YAP</button>
        </div>
    </div>

    <div class="app-container" id="mainApp" style="display: none;">
        <!-- Top Bar -->
        <div class="top-bar">
            <h1 onclick="showScreen('table-screen')">Restoran 🤵</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="terminal-mode-chip" id="terminalModeChip">ORTAK</span>
                <button class="btn-tools dim-toggle" id="btnDimMode" onclick="toggleLowLight()" title="Düşük ışık">☾</button>
                <button class="btn-tools qr-tools" onclick="openQrTools()">QR/NFC</button>
                <span id="waiterDisplayName" style="color: #999; font-size: 12px;"></span>
                <div class="selected-table-info" id="activeTableName">MASA SEÇİN</div>

        <div class="viewport">

            <div id="table-screen" class="screen active">
                <div class="section-title">Masalar</div>
                <div class="grid" id="tablesContainer"></div>
                <div class="section-title">Paketler</div>
                <div class="grid" id="paketsContainer"></div>

            <!-- Screen 2: Menu & Order -->
            <div id="order-screen" class="screen">
                <div class="category-tabs" id="categoryContainer"></div>
                <div class="grid" id="menuItemsContainer"></div>

        <!-- Basket Overlay -->
        <div class="basket-panel" id="basketPanel" style="display: none;">
            <div class="section-title">Sepet <span id="basketCount" class="badge">0</span></div>
            <div class="basket-list" id="basketList"></div>
            <div class="basket-footer">
                <div class="total" id="basketTotal">0.00 TL</div>
                <button class="btn-transfer-table" id="btnTransferTable" onclick="openTransferModal()" style="display: none;">MASA TAŞI</button>
                <button class="btn-served" id="btnMarkServed" onclick="markReadyItemsServed()" style="display: none;">SERVİS EDİLDİ</button>
                <button class="btn-send" onclick="sendOrder()">GÖNDER</button>

        <div class="tools-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <strong>QR / NFC Araçları</strong>
                <span id="toolsCurrentTable" style="font-size:12px;color:#9aa0a6;">Masa: -</span>
            </div>
            <div class="tools-grid">
                <div class="tools-box">
                    <h3>Dinamik QR Üret</h3>
                    <input id="qrKasaId" type="number" value="1" min="1" placeholder="Kasa ID">
                    <button class="btn-primary" onclick="generateDynamicQr()">QR Üret</button>
                    <div id="qrOutput" class="tools-output" style="text-align: center;">
                        <div id="qrImageContainer" style="margin: 10px 0;"></div>
                        <div id="qrTextInfo" style="font-size: 11px; color: #9aa0a6;">Henüz üretilmedi.</div>
                    </div>

                    <input id="nfcUidInput" placeholder="NFC UID">

                    <button class="btn-ok" onclick="registerNfcTag()">NFC Kaydet</button>
                    <div id="nfcOutput" class="tools-output">Henüz kayıt yapılmadı.</div>

    <div id="transferModal" class="transfer-modal">
        <div class="transfer-card">
            <div class="transfer-header">
                <div>
                    <div class="transfer-title">Masa Taşı</div>
                    <div class="transfer-source" id="transferSourceInfo">Kaynak: -</div>
                </div>
                <button class="transfer-close" type="button" onclick="closeTransferModal()">×</button>

            <div class="transfer-grid" id="transferTargetGrid"></div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        function syncAppHeight() {
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
        }

        syncAppHeight();
        window.addEventListener('resize', syncAppHeight);
        window.addEventListener('orientationchange', () => setTimeout(syncAppHeight, 250));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncAppHeight);
            window.visualViewport.addEventListener('scroll', syncAppHeight);
        }

        let socket = io();
        let menuData = {};
        let waiterMenuData = {};
        let portionStock = {};
        let dailyMeals = { items: [] };
        let prepPanels = [];
        let prepCategoryOverrides = {};
        const DEFAULT_PORTION_STOCK = 40;
        let waiterAdisyonlar = {};
        let sysInfo = {};
        let currentTable = null;
        let basket = []; // Henüz gönderilmemiş yerel sepet
        let serverItems = []; // Sunucudan gelen aktif siparişler
        let currentCategory = null;
        let loggedWaiter = null;
        let loggedPin = null;
        let pendingTransfer = null;
        const sharedTerminalMode = isSharedTerminalMode();

        function isSharedTerminalMode() {
            const params = new URLSearchParams(window.location.search);
            return window.location.pathname.includes('garson-terminal')
                || window.location.pathname.includes('/waiter/shared')
                || params.get('shared') === '1'
                || params.get('mode') === 'shared';
        }

        function setLowLight(enabled) {
            document.body.classList.toggle('low-light', enabled);
            localStorage.setItem('waiter_low_light', enabled ? 'low' : 'normal');
            const btn = document.getElementById('btnDimMode');
            if (btn) {
                btn.textContent = enabled ? '☾' : '☀';
                btn.title = enabled ? 'Normal ışığa geç' : 'Düşük ışığa geç';
            }
        }

        function toggleLowLight() {
            setLowLight(!document.body.classList.contains('low-light'));
        }

        function openSharedTerminal() {
            loggedWaiter = 'Ortak Terminal';
            loggedPin = '';
            document.getElementById('waiterDisplayName').textContent = 'Ortak Terminal';
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('terminalModeChip').textContent = 'ORTAK';
            socket.emit('waiter_init', { name: loggedWaiter });
        }

        function openAuthenticatedWaiter(user) {
            loggedWaiter = user?.name || 'Garson';
            loggedPin = '';
            document.getElementById('waiterDisplayName').textContent = '🤵 ' + loggedWaiter;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            socket.emit('waiter_init', { name: loggedWaiter });
        }

        setLowLight(document.body.classList.contains('low-light'));
        if (sharedTerminalMode) {
            openSharedTerminal();
        }

        function isComplimentaryItem(item) {
            return (item?.tip || '') === 'ikram';
        }

        function isReadyItem(item) {
            return item && item.durum === 'hazir';
        }

        function isServedItem(item) {
            return item && item.durum === 'servis_edildi';
        }

        function isKitchenCancelableItem(item) {
            return !item?.durum || item.durum === 'mutfakta';
        }

        function getLineTotal(item) {
            const adet = Number(item?.adet || 0);
            const fiyat = Number(item?.fiyat || 0);
            return Math.max(0, adet) * Math.max(0, fiyat);
        }

        const WAITER_LEGACY_MEAL_GROUPS = [
            { name: 'Dana Etli Yemekler', matches: ['dana etli yemek'] },
            { name: 'Kuzu Etli Yemekler', matches: ['kuzu etli yemek'] },
            { name: 'Kıymalı Yemekler', matches: ['kıymalı yemek', 'kiymali yemek'] },
            { name: 'Tavuk Etli Yemekler', matches: ['tavuklu yemek', 'tavuk etli yemek'] },
            { name: 'Etsiz Yemekler', matches: ['etsiz yemek'] }
        ];
        const WAITER_CATEGORY_PRIORITY = [
            'Izgara',
            'Dana Etli Yemekler',
            'Kuzu Etli Yemekler',
            'Kıymalı Yemekler',
            'Tavuk Etli Yemekler',
            'Etsiz Yemekler',
            'Başlangıç'
        ];
        const WAITER_CATEGORY_LABELS = {
            'başlangıç': 'Başl.',
            'dana etli yemekler': 'Dana',
            'kuzu etli yemekler': 'Kuzu',
            'tavuk etli yemekler': 'Tavuk',
            'etsiz yemekler': 'Etsiz',
            'kıymalı yemekler': 'Kıymalı',
            'soğuk içecekler': 'Soğuk',
            'sıcak içecekler': 'Sıcak',
            'süt tatlıları': 'Sütlü',
            'baklavalar': 'Baklava',
            'dondurma': 'Dond.'
        };
        const GRILL_PORTION_VALUES = [0.5, 1, 1.5];

        function normalizeMenuText(value) {
            return String(value || '').trim().toLocaleLowerCase('tr-TR');
        }

        function normalizePrepText(value) {
            return String(value || '')
                .trim()
                .toLocaleLowerCase('tr-TR')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/ı/g, 'i');
        }

        function getPrepPanelById(panelId) {
            return (prepPanels || []).find(panel => panel.id === panelId) || null;
        }

        function getDefaultPrepPanelId() {
            return getPrepPanelById('mutfak') ? 'mutfak' : ((prepPanels || [])[0]?.id || 'mutfak');
        }

        function getPrepPanelForCategory(category) {
            const categoryName = String(category || '').trim();
            if (categoryName && prepCategoryOverrides[categoryName]) {
                return prepCategoryOverrides[categoryName];
            }

            const normalized = normalizePrepText(categoryName);
            const match = (prepPanels || []).find(panel => {
                return (panel.category_keywords || []).some(keyword => {
                    const key = normalizePrepText(keyword);
                    return key && normalized.includes(key);
                });
            });
            return match?.id || getDefaultPrepPanelId();
        }

        function getPrepPanelForOrderItem(name, category = '') {
            const productText = normalizePrepText(name);
            const productPanel = (prepPanels || []).find(panel => {
                return (panel.product_keywords || []).some(keyword => {
                    const key = normalizePrepText(keyword);
                    return key && productText.includes(key);
                });
            });

            if (productPanel?.id === 'izgara') return productPanel.id;

            const categoryPanelId = getPrepPanelForCategory(category);
            if (category && categoryPanelId !== getDefaultPrepPanelId()) return categoryPanelId;
            if (productPanel?.id) return productPanel.id;
            if (` ${productText} `.includes(' su ')) return 'icecek';
            return categoryPanelId;
        }

        function getQuickNotesForBasketItem(item) {
            const panelId = item.panelId || getPrepPanelForOrderItem(item.name, item.category);
            const panel = getPrepPanelById(panelId);
            return (panel?.quick_notes || [])
                .map(note => String(note || '').trim())
                .filter(Boolean);
        }

        function splitReadyNoteTokens(value) {
            return String(value || '')
                .split(',')
                .map(note => note.trim())
                .filter(Boolean);
        }

        function readyNoteKey(value) {
            return normalizePrepText(value);
        }

        function basketItemHasReadyNote(item, note) {
            const target = readyNoteKey(note);
            return splitReadyNoteTokens(item.note || '').some(existing => readyNoteKey(existing) === target);
        }

        function toggleReadyNote(index, note) {
            if (!basket[index]) return;
            const tokens = splitReadyNoteTokens(basket[index].note || '');
            const target = readyNoteKey(note);
            const existingIndex = tokens.findIndex(existing => readyNoteKey(existing) === target);
            if (existingIndex >= 0) {
                tokens.splice(existingIndex, 1);
            } else {
                tokens.push(note);
            }
            basket[index].note = tokens.join(', ').slice(0, 160);
            updateBasketDisplay();
        }

        function appendReadyNoteButtons(row, index, item) {
            const container = row.querySelector('.ready-note-buttons');
            if (!container) return;
            const notes = getQuickNotesForBasketItem(item);
            if (!notes.length) {
                container.remove();
                return;
            }

            notes.forEach(note => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'ready-note-btn' + (basketItemHasReadyNote(item, note) ? ' active' : '');
                button.textContent = note;
                button.onclick = () => toggleReadyNote(index, note);
                container.appendChild(button);
            });
        }

        function composeBasketItemNote(item) {
            return [item?.baseNote || '', item?.note || '']
                .map(part => String(part || '').trim())
                .filter(Boolean)
                .join('\n')
                .slice(0, 160);
        }

        function isGrillCategory(category) {
            const normalized = normalizeMenuText(category);
            return normalized === 'ızgara' || normalized === 'izgara';
        }

        function getDailyMealCategoryNames() {
            return Array.isArray(dailyMeals.categories) ? dailyMeals.categories : [];
        }

        function getDailyMealCategoryMatch(category) {
            const target = normalizeMenuText(category);
            if (!target) return null;
            return getDailyMealCategoryNames().find(name => normalizeMenuText(name) === target) || null;
        }

        function getWaiterFixedMealGroup(item, category) {
            const categoryMatch = getDailyMealCategoryMatch(category);
            if (categoryMatch) return categoryMatch;

            const text = normalizeMenuText(`${category} ${item?.[0] || ''}`);
            const directMatch = getDailyMealCategoryNames().find(name => {
                const key = normalizeMenuText(name);
                return key && text.includes(key);
            });
            if (directMatch) return directMatch;

            const legacyGroup = WAITER_LEGACY_MEAL_GROUPS.find(entry => {
                return getDailyMealCategoryMatch(entry.name)
                    && entry.matches.some(keyword => text.includes(keyword));
            });
            return legacyGroup ? getDailyMealCategoryMatch(legacyGroup.name) : null;
        }

        function appendFixedMealGroups(target, groupedItems) {
            getDailyMealCategoryNames().forEach(name => {
                const items = groupedItems[name] || [];
                if (!items.length) return;
                if (!target[name]) target[name] = [];
                target[name].push(...items);
            });
        }

        function appendMenuItems(target, category, items) {
            if (!items.length) return;
            if (!target[category]) target[category] = [];
            target[category].push(...items);
        }

        function isStewAndOvenCategory(category) {
            return normalizeMenuText(category) === 'tencere ve fırın';
        }

        function getWaiterDisplayCategory(category) {
            return normalizeMenuText(category) === 'yemek' ? 'Izgara' : category;
        }

        function getWaiterCategoryLabel(category) {
            return WAITER_CATEGORY_LABELS[normalizeMenuText(category)] || category;
        }

        function getWaiterCategoryPriority(category) {
            const index = WAITER_CATEGORY_PRIORITY.findIndex(entry => normalizeMenuText(entry) === normalizeMenuText(category));
            return index === -1 ? WAITER_CATEGORY_PRIORITY.length : index;
        }

        function sortWaiterCategories(categories) {
            const sourceOrder = new Map(categories.map((category, index) => [category, index]));
            return categories.slice().sort((first, second) => {
                const firstPriority = getWaiterCategoryPriority(first);
                const secondPriority = getWaiterCategoryPriority(second);
                if (firstPriority !== secondPriority) return firstPriority - secondPriority;
                return (sourceOrder.get(first) || 0) - (sourceOrder.get(second) || 0);
            });
        }

        function getDailyMealsForCategory(category) {
            const target = normalizeMenuText(category);
            return (dailyMeals.items || []).filter(item => normalizeMenuText(item.kategori) === target);
        }

        function isDailyMealCategory(category) {
            return !!getDailyMealCategoryMatch(category);
        }

        function getDailyGroupRemaining(category) {
            const stock = getPortionStock(category);
            if (stock && stock.tracked) return Number(stock.kalan || 0);
            return getDailyMealsForCategory(category).reduce((sum, item) => {
                const mealStock = getPortionStock(item.yemek);
                return sum + Number(mealStock?.kalan ?? item.kalan ?? item.porsiyon ?? 0);
            }, 0);
        }

        function buildWaiterMenuData(sourceMenu) {
            const nextMenu = {};
            const groupedItems = {};
            const categoryEntries = [];
            let fixedGroupsInserted = false;

            getDailyMealCategoryNames().forEach(name => {
                groupedItems[name] = [];
            });

            Object.entries(sourceMenu || {}).forEach(([category, items]) => {
                const remainingItems = [];

                (items || []).forEach(item => {
                    const groupName = getWaiterFixedMealGroup(item, category);
                    if (groupName) {
                        groupedItems[groupName].push(item);
                    } else {
                        remainingItems.push(item);
                    }
                });

                categoryEntries.push({ category, remainingItems });
            });

            categoryEntries.forEach(({ category, remainingItems }) => {
                appendMenuItems(nextMenu, getWaiterDisplayCategory(category), remainingItems);
                if (isStewAndOvenCategory(category)) {
                    appendFixedMealGroups(nextMenu, groupedItems);
                    fixedGroupsInserted = true;
                }
            });

            if (!fixedGroupsInserted) {
                appendFixedMealGroups(nextMenu, groupedItems);
            }

            return nextMenu;
        }

        function formatOrderNote(note) {
            const text = String(note || '').trim();
            if (!text) return '';
            const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            if (!lines.length) return '';
            if (lines[0].startsWith('Yemek:')) {
                const extra = lines.slice(1).join(', ');
                return extra ? `${lines[0]} • Not: ${extra}` : lines[0];
            }
            return `Not: ${lines.join(', ')}`;
        }

        function parsePortionVariantName(name) {
            const match = String(name || '').trim().match(/^(tam|yarım|yarim)\s+porsiyon\s+(.+)$/i);
            if (!match) return null;
            const type = normalizeMenuText(match[1]).startsWith('yar') ? 'half' : 'full';
            return {
                type,
                baseName: match[2].trim(),
                label: type === 'full' ? 'Tam Porsiyon' : 'Yarım Porsiyon'
            };
        }

        function getPortionVariantOrder(type) {
            if (type === 'full') return 0;
            if (type === 'half') return 1;
            if (type === 'onehalf') return 2;
            return 2;
        }

        function sortPortionVariants(variants) {
            return variants.slice().sort((first, second) => {
                return getPortionVariantOrder(first.type) - getPortionVariantOrder(second.type);
            });
        }

        function getPortionVariantLabel(variant) {
            if (variant?.type === 'half') return 'Yarım Porsiyon';
            if (variant?.type === 'onehalf') return '1.5 Porsiyon';
            return 'Tam Porsiyon';
        }

        function getPortionVariantShortLabel(variant) {
            if (variant?.type === 'half') return 'Yarım';
            if (variant?.type === 'onehalf') return '1.5';
            return 'Tam';
        }

        function getPortionVariantUnitMultiplier(variant) {
            if (!variant) return 1;
            if (variant.type === 'half') return 0.5;
            if (variant.type === 'onehalf') return 1.5;
            return 1;
        }

        function buildPortionChoiceVariants(name, variants) {
            const ordered = sortPortionVariants(variants || []);
            const hasOneHalf = ordered.some(variant => Math.abs(getPortionVariantUnitMultiplier(variant) - 1.5) < 0.001);
            const fullVariant = ordered.find(variant => variant.type === 'full');
            if (!hasOneHalf && fullVariant?.item) {
                const sourceItem = Array.isArray(fullVariant.item) ? fullVariant.item.slice() : [];
                const fullPrice = Number(sourceItem[1] || 0);
                if (Number.isFinite(fullPrice) && fullPrice > 0) {
                    const syntheticBaseName = fullVariant.baseName || name;
                    sourceItem[0] = `${syntheticBaseName} (1.5 porsiyon)`;
                    sourceItem[1] = roundMoney(fullPrice * 1.5);
                    ordered.push({
                        type: 'onehalf',
                        baseName: syntheticBaseName,
                        label: '1.5 Porsiyon',
                        synthetic: true,
                        item: sourceItem
                    });
                }
            }
            return sortPortionVariants(ordered);
        }

        function buildWaiterMenuCards(items) {
            const cards = [];
            const groupedPortions = new Map();

            (items || []).forEach(item => {
                const parsed = parsePortionVariantName(item?.[0]);
                if (!parsed) {
                    cards.push({ type: 'item', item });
                    return;
                }

                const key = normalizeMenuText(parsed.baseName);
                let card = groupedPortions.get(key);
                if (!card) {
                    card = {
                        type: 'portion-group',
                        name: parsed.baseName,
                        variants: []
                    };
                    groupedPortions.set(key, card);
                    cards.push(card);
                }
                card.variants.push({ ...parsed, item });
            });

            cards.forEach(card => {
                if (card.type === 'portion-group') {
                    card.variants = sortPortionVariants(card.variants);
                }
            });

            return cards;
        }

        function formatMenuPrice(value) {
            const amount = Number(value);
            if (!Number.isFinite(amount)) return String(value || '0');
            return Number.isInteger(amount) ? String(amount) : amount.toFixed(2);
        }

        function roundMoney(value) {
            const amount = Number(value);
            if (!Number.isFinite(amount)) return 0;
            return Math.round(amount * 100) / 100;
        }

        function parseTrailingPortionName(name) {
            let cleanName = String(name || '').trim();
            let multiplier = 1;
            const match = cleanName.match(/\(\s*(\d+(?:[,.]\d+)?)\s*porsiyon\s*\)\s*$/i);
            if (match) {
                const parsed = Number(match[1].replace(',', '.'));
                if (Number.isFinite(parsed) && parsed > 0) multiplier = parsed;
                cleanName = cleanName.replace(/\(\s*\d+(?:[,.]\d+)?\s*porsiyon\s*\)\s*$/i, '').trim();
            }
            return { name: cleanName, multiplier };
        }

        function formatPortionChoiceLabel(value) {
            const amount = Number(value);
            if (amount === 0.5) return 'Yarım';
            if (amount === 1) return '1 Porsiyon';
            return `${formatPortionAmount(amount)} Porsiyon`;
        }

        function isFixedGrillServingName(name) {
            const normalized = normalizeMenuText(name);
            return normalized.includes('kişilik') || normalized.includes('kisilik');
        }

        function getGrillOrderInfo(card) {
            if (!card) return null;

            if (card.type === 'portion-group') {
                const variants = sortPortionVariants(card.variants || []);
                const fullVariant = variants.find(variant => variant.type === 'full');
                const sourceVariant = fullVariant || variants[0];
                if (!sourceVariant || !sourceVariant.item) return null;
                const sourceMultiplier = getPortionVariantUnitMultiplier(sourceVariant);
                const sourcePrice = Number(sourceVariant.item[1] || 0);
                const basePrice = sourceMultiplier > 0 ? roundMoney(sourcePrice / sourceMultiplier) : sourcePrice;
                return {
                    name: card.name,
                    basePrice,
                    sourceItem: sourceVariant.item
                };
            }

            const item = card.item;
            if (!item) return null;
            if (isFixedGrillServingName(item[0])) return null;
            const parsedName = parseTrailingPortionName(item[0]);
            const sourcePrice = Number(item[1] || 0);
            const basePrice = parsedName.multiplier > 0
                ? roundMoney(sourcePrice / parsedName.multiplier)
                : sourcePrice;
            return {
                name: parsedName.name || item[0],
                basePrice,
                sourceItem: item
            };
        }

        function getGrillPortionPriceHtml(basePrice) {
            return `<span class="grill-portion-list">${GRILL_PORTION_VALUES.map(value => {
                return `<span>${formatPortionChoiceLabel(value)}: ${formatMenuPrice(roundMoney(basePrice * value))} TL</span>`;
            }).join('')}</span>`;
        }

        function getPortionPriceHtml(variants) {
            return `<span class="portion-price-list">${buildPortionChoiceVariants('', variants).map(variant => {
                return `<span>${getPortionVariantShortLabel(variant)}: ${formatMenuPrice(variant.item[1])} TL</span>`;
            }).join('')}</span>`;
        }

        function getDailyMealPortionGroup(items, category) {
            const cards = buildWaiterMenuCards(items);
            const categoryKey = normalizeMenuText(category);
            return cards.find(card => {
                return card.type === 'portion-group' && normalizeMenuText(card.name) === categoryKey;
            }) || cards.find(card => card.type === 'portion-group') || null;
        }

        function ensurePortionSelectModal() {
            let modal = document.getElementById('portionSelectModal');
            if (modal) return modal;

            modal = document.createElement('div');
            modal.id = 'portionSelectModal';
            modal.className = 'portion-select-modal';
            modal.innerHTML = `
                <div class="portion-select-card">
                    <div class="portion-select-title" id="portionSelectTitle"></div>
                    <div class="portion-select-options" id="portionSelectOptions"></div>
                    <button class="portion-select-cancel" type="button" id="portionSelectCancel">Vazgeç</button>
                </div>
            `;
            document.body.appendChild(modal);
            return modal;
        }

        function closePortionSelectModal() {
            const modal = document.getElementById('portionSelectModal');
            if (modal) modal.style.display = 'none';
        }

        function choosePortionVariant(name, variants) {
            const ordered = buildPortionChoiceVariants(name, variants || []);
            if (!ordered.length) return null;
            if (ordered.length === 1) return ordered[0];

            const modal = ensurePortionSelectModal();
            const title = document.getElementById('portionSelectTitle');
            const options = document.getElementById('portionSelectOptions');
            const cancel = document.getElementById('portionSelectCancel');
            title.textContent = `${name} için porsiyon seçin`;
            options.innerHTML = '';

            return new Promise(resolve => {
                let resolved = false;
                const finish = (variant) => {
                    if (resolved) return;
                    resolved = true;
                    closePortionSelectModal();
                    modal.onclick = null;
                    cancel.onclick = null;
                    resolve(variant || null);
                };

                ordered.forEach(variant => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'portion-select-btn';
                    btn.innerHTML = `
                        <span class="portion-select-label">${escapeHtml(getPortionVariantLabel(variant))}</span>
                        <span class="portion-select-price">${formatMenuPrice(variant.item[1])} TL</span>
                    `;
                    btn.onclick = () => finish(variant);
                    options.appendChild(btn);
                });

                cancel.onclick = () => finish(null);
                modal.onclick = (event) => {
                    if (event.target === modal) finish(null);
                };
                modal.style.display = 'flex';
            });
        }

        function renderMenuItems() {
            const cont = document.getElementById('menuItemsContainer');
            if (!cont) return;
            cont.innerHTML = '';
            const items = (waiterMenuData[currentCategory] || []).filter(isMenuItemVisible);
            if (!items.length) {
                cont.innerHTML = '<div style="padding:20px;color:#aaa;">Menüde gösterilecek ürün yok.</div>';
                return;
            }
            if (isDailyMealCategory(currentCategory)) {
                const meals = getDailyMealsForCategory(currentCategory);
                const portionGroup = getDailyMealPortionGroup(items, currentCategory);
                if (meals.length && portionGroup) {
                    renderDailyMealItems(cont, meals, portionGroup, currentCategory);
                    return;
                }
            }
            const cards = buildWaiterMenuCards(items);
            cards.forEach(card => {
                const item = card.type === 'portion-group' ? card.variants[0].item : card.item;
                const grillOrderInfo = isGrillCategory(currentCategory) ? getGrillOrderInfo(card) : null;
                const displayName = grillOrderInfo
                    ? grillOrderInfo.name
                    : (card.type === 'portion-group' ? card.name : item[0]);
                const stock = isDailyMealCategory(currentCategory) ? getPortionStock(currentCategory) : null;
                const tracked = !!(stock && stock.tracked);
                const remaining = isDailyMealCategory(currentCategory) ? getDailyGroupRemaining(currentCategory) : (tracked ? Number(stock.kalan || 0) : null);
                const soldOut = tracked && remaining <= 0;
                const div = document.createElement('div');
                div.className = 'btn-item' + (soldOut ? ' sold-out' : (tracked && remaining <= 5 ? ' low-stock' : ''));
                const mealNames = getDailyMealsForCategory(currentCategory)
                    .map(meal => {
                        const mealStock = getPortionStock(meal.yemek);
                        const mealRemaining = Number(mealStock?.kalan ?? meal.kalan ?? meal.porsiyon ?? 0);
                        return `${meal.yemek}: ${formatPortionAmount(mealRemaining)}`;
                    })
                    .join(' • ');
                const portionHtml = tracked
                    ? `<span class="portion-badge ${soldOut ? 'empty' : (remaining <= 5 ? 'low' : '')}">${soldOut ? 'TÜKENDİ' : 'Kalan: ' + formatPortionAmount(remaining)}</span>`
                    : '';
                const priceHtml = grillOrderInfo
                    ? getGrillPortionPriceHtml(grillOrderInfo.basePrice)
                    : card.type === 'portion-group'
                    ? getPortionPriceHtml(card.variants)
                    : `<span class="price">${formatMenuPrice(item[1])} TL</span>`;
                div.innerHTML = `<span class="item-name">${escapeHtml(displayName)}${mealNames ? `<small style="display:block;color:#9ca3af;font-size:11px;margin-top:4px;">${escapeHtml(mealNames)}</small>` : ''}</span>${priceHtml}${portionHtml}`;
                div.onclick = async () => {
                    if (soldOut) {
                        alert(`${displayName} tükendi`);
                        return;
                    }
                    if (grillOrderInfo) {
                        await addGrillToBasket(grillOrderInfo, currentCategory);
                    } else if (card.type === 'portion-group') {
                        await addPortionGroupToBasket(card.name, card.variants, currentCategory);
                    } else {
                        addToBasket(item[0], item[1], currentCategory);
                    }
                };
                cont.appendChild(div);
            });
        }

        function renderDailyMealItems(cont, meals, portionGroup, category) {
            meals.forEach(meal => {
                const mealName = String(meal.yemek || '').trim();
                if (!mealName) return;
                const stock = getPortionStock(mealName);
                const tracked = !!(stock && stock.tracked);
                const remaining = Number(stock?.kalan ?? meal.kalan ?? meal.porsiyon ?? 0);
                const soldOut = tracked && remaining <= 0;
                const div = document.createElement('div');
                div.className = 'btn-item' + (soldOut ? ' sold-out' : (remaining <= 5 ? ' low-stock' : ''));
                const portionHtml = `<span class="portion-badge ${soldOut ? 'empty' : (remaining <= 5 ? 'low' : '')}">${soldOut ? 'TÜKENDİ' : 'Kalan: ' + formatPortionAmount(remaining)}</span>`;
                div.innerHTML = `<span class="item-name">${escapeHtml(mealName)}</span>${getPortionPriceHtml(portionGroup.variants)}${portionHtml}`;
                div.onclick = async () => {
                    if (soldOut) {
                        alert(`${mealName} tükendi`);

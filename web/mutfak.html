<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutfak Ekranı - Restoran</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            overflow: auto;
        }

        .kitchen-title-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .kitchen-title-block h1 {
            margin: 0;
        }

        .panel-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .panel-link {
            color: #dbeafe;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 7px 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
        }

        .panel-link.active {
            color: #111827;
            background: #f8fafc;
            border-color: #f8fafc;
        }

        .kitchen-grid {
            padding: 20px;
        }

        .aggregate-total {
            color: #111827;
            font-size: 30px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        .aggregate-breakdown {
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .aggregate-source-items {
            display: flex;
        }

        .portion-panel {
            background: #111827;
            border: 1px solid #2f3a4a;
            border-radius: 12px;
            margin-bottom: 16px;
            padding: 14px;
        }

        .daily-meals-panel {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            margin-bottom: 16px;
            padding: 14px;
        }

        .daily-meals-toolbar {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .daily-meals-title {
            font-weight: 900;
            color: #f8fafc;
            font-size: 18px;
        }

        .daily-meals-meta {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 3px;
        }

        .daily-meals-text {
            width: 100%;
            min-height: 160px;
            resize: vertical;
            box-sizing: border-box;
            background: #020617;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.45;
        }

        .daily-meals-status {
            margin-top: 8px;
            min-height: 18px;
            color: #94a3b8;
            font-size: 12px;
        }

        .portion-toolbar {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) 220px auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        .portion-title {
            font-weight: 800;
            color: #f8fafc;
            font-size: 18px;
        }

        .portion-search,
        .portion-input {
            width: 100%;
            background: #0b1220;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
        }

        .portion-save,
        .portion-zero {
            border: 0;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        .portion-save {
            background: #16a34a;
        }

        .portion-zero {
            background: #dc2626;
        }

        .reservation-notice-card {
            border: 2px solid #f59e0b;
            border-radius: 12px;
            background: #fffbeb;
            color: #111827;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.22);
        }

        .reservation-notice-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .reservation-notice-title {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.2;
        }

        .reservation-notice-meta,
        .reservation-notice-note {
            color: #78350f;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.35;
        }

        .reservation-notice-items {
            display: grid;
            gap: 6px;
            margin-top: 10px;
        }

        .reservation-notice-item {
            padding: 8px 10px;
            border-radius: 8px;
            background: #fff7ed;
            color: #111827;
            font-size: 15px;
            font-weight: 900;
        }

        .portion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 8px;
            max-height: 260px;
            overflow: auto;
        }

        .portion-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 84px 74px;
            gap: 8px;
            align-items: center;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 9px;
        }

        .portion-name {
            min-width: 0;
        }

        .portion-name strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #fff;
        }

        .portion-name span {
            display: block;
            margin-top: 3px;
            color: #94a3b8;
            font-size: 11px;
        }

        @media (max-width: 760px) {
            .kitchen-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .portion-toolbar {
                grid-template-columns: 1fr;
            }

            .daily-meals-toolbar {
                grid-template-columns: 1fr;
            }

            .portion-row {
                grid-template-columns: minmax(0, 1fr) 76px 70px;
            }
        }
    </style>
</head>

<body>
    <div class="kitchen-container">
        <header class="kitchen-header">
            <div class="kitchen-title-block">
                <h1 id="panelTitle">👨‍🍳 MUTFAK SİPARİŞ TAKİP</h1>
                <nav class="panel-nav" id="panelNav" aria-label="Hazırlık panelleri"></nav>
            </div>
            <div class="auto-print-switch">
                <label>Otomatik Yazdır</label>
                <input type="checkbox" id="autoPrintToggle">
            </div>
            <div id="clock" style="font-size: 24px; font-weight: bold;">00:00:00</div>
        </header>
        <div class="kitchen-grid" id="kitchenGrid">
            <!-- Sipariş kartları buraya gelecek -->
        </div>
    </div>

    <!-- Yazdırma Alanı (Gizli) -->
    <div id="printArea" class="print-area" style="display: none;"></div>

    <script>
        const socket = io();
        const kitchenGrid = document.getElementById('kitchenGrid');
        const autoPrintToggle = document.getElementById('autoPrintToggle');
        const orders = [];
        let menuData = {};
        let portionStock = {};
        let portionDraft = {};
        let dailyMeals = { items: [], text: '', date: '' };
        const DEFAULT_PORTION_STOCK = 40;
        const defaultPanels = [
            { id: 'izgara', name: 'Izgara', title: 'IZGARA SİPARİŞ TAKİP', ticket_title: 'IZGARA FİŞİ', emoji: '🔥', aggregate: false, category_keywords: ['izgara', 'kebap', 'kofte', 'sis'], product_keywords: ['izgara', 'kofte', 'kebap', 'adana', 'beyti', 'sis', 'kanat', 'incik', 'biftek', 'karisik', 'tepsi'] },
            { id: 'mutfak', name: 'Mutfak', title: 'MUTFAK SİPARİŞ TAKİP', ticket_title: 'MUTFAK FİŞİ', emoji: '👨‍🍳', aggregate: false },
            { id: 'icecek', name: 'İçecek', title: 'İÇECEK SİPARİŞ TAKİP', ticket_title: 'İÇECEK FİŞİ', emoji: '🥤', aggregate: true, category_keywords: ['icecek', 'mesrubat', 'cay', 'kahve', 'soda'], product_keywords: ['ayran', 'salgam', 'soda', 'gazoz', 'meyve suyu', 'mesrubat', 'kahve', 'cay'] },
            { id: 'tatli', name: 'Tatlı', title: 'TATLI SİPARİŞ TAKİP', ticket_title: 'TATLI FİŞİ', emoji: '🍰', aggregate: false, category_keywords: ['tatli', 'baklava', 'dondurma', 'sut tatlilari', 'sutlu tatli'], product_keywords: ['baklava', 'sutlac', 'kazandibi', 'supangle', 'dondurma'] }
        ];
        let prepPanels = defaultPanels;
        let prepCategoryOverrides = {};
        let prepTicketSkipProducts = [];
        const PRINT_BATCH_DELAY_MS = 1000;
        const prepPrintBatches = new Map();
        function panelFromLocation() {
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts[0] === 'reyon' && pathParts[1]) return pathParts[1];
            if (window.location.pathname.includes('izgara')) return 'izgara';
            if (window.location.pathname.includes('icecek')) return 'icecek';
            if (window.location.pathname.includes('tatli')) return 'tatli';
            return 'mutfak';
        }
        const panelFromPath = panelFromLocation();
        const currentPanelId = new URLSearchParams(window.location.search).get('panel') || panelFromPath;

        function currentPanel() {
            return prepPanels.find(panel => panel.id === currentPanelId) || prepPanels[0] || defaultPanels[0];
        }

        function normalizeTextForMatch(value) {
            return String(value ?? '')
                .toLocaleLowerCase('tr-TR')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/ı/g, 'i');
        }

        function normalizeProductKey(value) {
            return normalizeTextForMatch(value).replace(/\s+/g, ' ').trim();
        }

        function prepTicketPortionLabelFromName(name) {
            const rawName = String(name || '').trim();
            let prefixMatch = rawName.match(/^(tam|yarım|yarim)\s+porsiyon\s+/i);
            if (!prefixMatch) {
                prefixMatch = rawName.match(/^(tam|yarım|yarim)\s+/i);
            }
            if (prefixMatch) {
                return normalizeTextForMatch(prefixMatch[1]).startsWith('yar') ? 'Yarım' : 'Tam';
            }

            const trailing = rawName.match(/\(\s*(\d+(?:[,.]\d+)?)\s*porsiyon\s*\)\s*$/i);
            if (!trailing) return '';

            const parsed = Number(trailing[1].replace(',', '.'));
            if (!Number.isFinite(parsed) || parsed <= 0) return '';
            if (Math.abs(parsed - 0.5) < 0.001) return 'Yarım';
            if (Math.abs(parsed - 1) < 0.001) return 'Tam';
            if (Math.abs(parsed - 1.5) < 0.001) return 'Bir Buçuk';
            return String(parsed);
        }

        function prepTicketPortionInfo(name) {
            const rawName = String(name || '').trim();
            let match = rawName.match(/^(tam|yarım|yarim)\s+porsiyon\s+(.+)$/i);
            if (!match) {
                match = rawName.match(/^(tam|yarım|yarim)\s+(.+)$/i);
            }
            if (match) {
                return {
                    label: normalizeTextForMatch(match[1]).startsWith('yar') ? 'Yarım' : 'Tam',
                    baseName: match[2].trim()
                };
            }

            const trailing = rawName.match(/\(\s*(\d+(?:[,.]\d+)?)\s*porsiyon\s*\)\s*$/i);
            if (!trailing) return { label: '', baseName: rawName };

            return {
                label: prepTicketPortionLabelFromName(rawName),
                baseName: rawName.replace(/\s*\(\s*\d+(?:[,.]\d+)?\s*porsiyon\s*\)\s*$/i, '').trim()
            };
        }

        function prepTicketPortionDisplayName(portionLabel, baseName) {
            const label = String(portionLabel || '').trim();
            const name = String(baseName || '').trim();
            const normalized = normalizeTextForMatch(label);
            if (normalized.startsWith('tam')) return name;
            if (normalized.startsWith('yarim')) {
                return normalizeTextForMatch(name).startsWith('yarim ') ? name : `Yarım ${name}`.trim();
            }
            if (normalized.startsWith('bir bucuk')) {
                return normalizeTextForMatch(name).startsWith('bir bucuk ') ? name : `Bir Buçuk ${name}`.trim();
            }
            return label ? `${label.replace(/\s+porsiyon\s*$/i, '')} ${name}`.trim() : name;
        }

        function prepTicketMealDisplayName(urun, mealName) {
            const mealInfo = prepTicketPortionInfo(mealName);
            if (mealInfo.label && mealInfo.baseName) {
                return prepTicketPortionDisplayName(mealInfo.label, mealInfo.baseName);
            }

            const productInfo = prepTicketPortionInfo(urun);
            if (productInfo.label) {
                return prepTicketPortionDisplayName(productInfo.label, mealName);
            }

            return String(mealName || '').trim();
        }

        function prepTicketMatchText(value) {
            return normalizeTextForMatch(value).replace(/[^0-9a-z]+/g, ' ').trim();
        }

        function escapeRegExp(value) {
            return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function prepTicketTermMatches(text, term) {
            const haystack = prepTicketMatchText(text);
            const needle = prepTicketMatchText(term);
            if (!haystack || !needle) return false;
            if (haystack === needle) return true;
            return new RegExp(`(^|\\s)${escapeRegExp(needle)}($|\\s)`).test(haystack);
        }

        function shouldPrintPrepTicket(data) {
            if (data?.prep_ticket_skipped) return false;
            return !prepTicketSkipProducts.some(term => prepTicketTermMatches(data?.urun, term));
        }

        function getMenuCategoryForProduct(urun) {
            const target = normalizeProductKey(urun);
            for (const [category, items] of Object.entries(menuData)) {
                const match = (items || []).some(item => normalizeProductKey(item[0]) === target);
                if (match) return category;
            }
            return '';
        }

        function getPanelIdForCategory(category) {
            const categoryName = String(category ?? '').trim();
            if (prepCategoryOverrides[categoryName]) {
                return prepCategoryOverrides[categoryName];
            }

            const normalized = normalizeTextForMatch(category);
            for (const [overrideCategory, panelId] of Object.entries(prepCategoryOverrides || {})) {
                if (normalizeTextForMatch(overrideCategory) === normalized) {
                    return panelId;
                }
            }

            for (const panel of prepPanels) {
                const keywords = panel.category_keywords || [];
                if (keywords.some(keyword => normalized.includes(keyword))) {
                    return panel.id;
                }
            }
            return 'mutfak';
        }

        function getOrderPanelId(data) {
            if (data.panel) return data.panel;
            const category = data.kategori || getMenuCategoryForProduct(data.urun);
            const productText = normalizeTextForMatch(data.urun);
            let productPanelId = null;
            for (const panel of prepPanels) {
                if (panel.id === 'izgara' && productText.includes('kiremitte')) {
                    continue;
                }
                const keywords = panel.product_keywords || panel.category_keywords || [];
                if (keywords.some(keyword => productText.includes(keyword))) {
                    productPanelId = panel.id;
                    break;
                }
            }
            if (productPanelId === 'izgara') return productPanelId;

            const panelId = getPanelIdForCategory(category);
            if (category && panelId !== 'mutfak') return panelId;

            if (productPanelId) return productPanelId;
            if (` ${productText} `.includes(' su ')) {
                return 'icecek';
            }
            return panelId;
        }

        function shouldShowOrder(data) {
            return getOrderPanelId(data) === currentPanelId;
        }

        function isWaitingForKitchen(item) {
            return !item.durum || item.durum === 'mutfakta';
        }

        function panelUrl(panelId) {
            if (panelId === 'izgara') return '/izgara';
            if (panelId === 'mutfak') return '/mutfak';
            if (panelId === 'icecek') return '/icecek';
            if (panelId === 'tatli') return '/tatli';
            return `/reyon/${encodeURIComponent(panelId)}`;
        }

        function renderPanelChrome() {
            const panel = currentPanel();
            document.title = `${panel.name} Ekranı - Restoran`;
            document.getElementById('panelTitle').textContent = `${panel.emoji || ''} ${panel.title || panel.name}`;
            const nav = document.getElementById('panelNav');
            nav.innerHTML = prepPanels.map(panelItem => `
                <a class="panel-link ${panelItem.id === currentPanelId ? 'active' : ''}" href="${panelUrl(panelItem.id)}">
                    ${escapeHtml(panelItem.emoji || '')} ${escapeHtml(panelItem.name)}
                </a>
            `).join('') + `
                <a class="panel-link" href="/porsiyon" target="_blank">📦 Porsiyon</a>
            `;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function escapeJs(value) {
            return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        const FIFO_UNKNOWN_SORT_KEY = Number.MAX_SAFE_INTEGER;
        let fifoSequence = 0;

        function getOrderSortKey(data) {
            const createdAt = data?.created_at || data?.createdAt || data?.tarih_saat || data?.Tarih_Saat || '';
            const createdTimestamp = Date.parse(createdAt);
            if (Number.isFinite(createdTimestamp)) return createdTimestamp;

            const match = String(data?.saat || '').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
            if (match) {
                const hour = Number(match[1]);
                const minute = Number(match[2]);
                const second = Number(match[3] || 0);
                if ([hour, minute, second].every(Number.isFinite)) {
                    return ((hour * 60 + minute) * 60 + second) * 1000;
                }
            }
            return FIFO_UNKNOWN_SORT_KEY;
        }

        function ensureOrderFifoMetadata(data) {
            if (!Number.isFinite(Number(data.__fifoSortKey))) {
                data.__fifoSortKey = getOrderSortKey(data);
            }
            if (!Number.isFinite(Number(data.__fifoSeq))) {
                data.__fifoSeq = ++fifoSequence;
            }
            return data;
        }

        function sortOrdersFifo(orderList) {
            return (orderList || [])
                .map((order, index) => ({ order: ensureOrderFifoMetadata(order), index }))
                .sort((a, b) => (
                    a.order.__fifoSortKey - b.order.__fifoSortKey ||
                    a.order.__fifoSeq - b.order.__fifoSeq ||
                    a.index - b.index
                ))
                .map(entry => entry.order);
        }

        function readFifoNumber(value, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function compareFifoValues(aKey, aSeq, bKey, bSeq) {
            return aKey - bKey || aSeq - bSeq;
        }

        function insertCardFifo(card) {
            const cardSortKey = readFifoNumber(card.dataset.sortKey, FIFO_UNKNOWN_SORT_KEY);
            const cardSeq = readFifoNumber(card.dataset.fifoSeq, FIFO_UNKNOWN_SORT_KEY);
            const beforeCard = Array.from(kitchenGrid.querySelectorAll('.order-card')).find(existingCard => {
                if (existingCard === card) return false;
                const existingSortKey = readFifoNumber(existingCard.dataset.sortKey, FIFO_UNKNOWN_SORT_KEY);
                const existingSeq = readFifoNumber(existingCard.dataset.fifoSeq, FIFO_UNKNOWN_SORT_KEY);
                return compareFifoValues(cardSortKey, cardSeq, existingSortKey, existingSeq) < 0;
            });
            kitchenGrid.insertBefore(card, beforeCard || null);
        }

        function syncCardFifoMetadata(card) {
            if (!card) return;
            const items = Array.from(card.querySelectorAll('.order-card-item'));
            if (!items.length) return;

            const firstItem = items.reduce((oldest, item) => {
                const current = {
                    element: item,
                    sortKey: readFifoNumber(item.dataset.sortKey, FIFO_UNKNOWN_SORT_KEY),
                    seq: readFifoNumber(item.dataset.fifoSeq, FIFO_UNKNOWN_SORT_KEY)
                };
                if (!oldest) return current;
                return compareFifoValues(current.sortKey, current.seq, oldest.sortKey, oldest.seq) < 0 ? current : oldest;
            }, null);

            card.dataset.sortKey = String(firstItem.sortKey);
            card.dataset.fifoSeq = String(firstItem.seq);
            const timeEl = card.querySelector('.order-card-time');
            if (timeEl && firstItem.element.dataset.saat) {
                timeEl.textContent = firstItem.element.dataset.saat;
            }
            insertCardFifo(card);
        }

        function formatOrderQuantity(value) {
            const quantity = Number(value || 0);
            if (!Number.isFinite(quantity)) return '0';
            if (Number.isInteger(quantity)) return String(quantity);
            return quantity.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
        }

        function parseOrderQuantity(value, fallback = 0) {
            const quantity = Number(String(value ?? '').replace(',', '.'));
            return Number.isFinite(quantity) ? quantity : fallback;
        }

        function getPortionLabelForAmount(value) {
            const amount = parseOrderQuantity(value, 0);
            if (Math.abs(amount - 0.5) < 0.001) {
                return { label: 'Yarım', sort: 0 };
            }
            if (Math.abs(amount - 1) < 0.001) {
                return { label: 'Tam', sort: 1 };
            }
            if (Math.abs(amount - 1.5) < 0.001) {
                return { label: 'Bir Buçuk', sort: 2 };
            }
            return null;
        }

        function parseExplicitPortionName(name) {
            const rawName = String(name ?? '').trim();
            let match = rawName.match(/^(tam|yarım|yarim)\s+porsiyon\s+(.+)$/i);
            if (!match) {
                match = rawName.match(/^(tam|yarım|yarim)\s+(.+)$/i);
            }
            if (match) {
                const isHalf = normalizeTextForMatch(match[1]) === 'yarim';
                return {
                    label: isHalf ? 'Yarım' : 'Tam',
                    sort: isHalf ? 0 : 1,
                    baseName: match[2].trim()
                };
            }

            match = rawName.match(/\(\s*(\d+(?:[,.]\d+)?)\s*porsiyon\s*\)\s*$/i);
            if (match) {
                const portion = getPortionLabelForAmount(match[1]);
                if (portion) {
                    return {
                        ...portion,
                        baseName: rawName.replace(/\(\s*\d+(?:[,.]\d+)?\s*porsiyon\s*\)\s*$/i, '').trim()
                    };
                }
            }
            return null;
        }

        function getOrderPortionInfo(data) {
            const explicit = parseExplicitPortionName(data?.urun);
            if (explicit && explicit.baseName) {
                return {
                    ...explicit,
                    quantity: Math.max(parseOrderQuantity(data?.adet, 1), 1),
                    dynamic: false
                };
            }

            const portion = getPortionLabelForAmount(data?.adet);
            if (!portion || getOrderPanelId(data) !== 'izgara') return null;
            const baseName = String(data?.urun ?? '').trim();
            if (!baseName) return null;
            return {
                ...portion,
                baseName,
                quantity: 1,
                dynamic: true
            };
        }

        function getOrderDisplayInfo(data) {
            const portion = getOrderPortionInfo(data);
            if (portion) {
                const productName = prepTicketPortionDisplayName(portion.label, portion.baseName);
                const displayPortionLabel = portion.label === 'Tam' ? '' : portion.label;
                return {
                    quantity: portion.quantity,
                    productName,
                    aggregateProductName: productName,
                    portionLabel: displayPortionLabel,
                    portionSort: displayPortionLabel ? portion.sort : 99
                };
            }

            return {
                quantity: parseOrderQuantity(data?.adet, 1) || 1,
                productName: String(data?.urun ?? '').trim(),
                aggregateProductName: String(data?.urun ?? '').trim(),
                portionLabel: '',
                portionSort: 99
            };
        }

        function getOrderTicketDisplayInfo(data) {
            const displayInfo = getOrderDisplayInfo(data);
            const mealName = extractMealNameFromNote(data?.not, data?.urun);
            if (!mealName) {
                return {
                    ...displayInfo,
                    ticketProductName: displayInfo.productName,
                    ticketAggregateProductName: displayInfo.aggregateProductName,
                    ticketNote: data?.not || ''
                };
            }

            return {
                ...displayInfo,
                productName: mealName,
                aggregateProductName: mealName,
                ticketProductName: mealName,
                ticketAggregateProductName: mealName,
                portionLabel: '',
                portionSort: 99,
                ticketNote: ''
            };
        }

        function getPlateGroupLabel(data) {
            const plate = data?.plate_group;
            if (!plate || typeof plate !== 'object') return '';
            const label = String(plate.label || '').trim();
            const id = String(plate.id || '').trim();
            if (label && id) return `${label} #${id}`;
            return label || (id ? `Tabak #${id}` : '');
        }

        function getPlateGroupNote(data) {
            const plate = data?.plate_group;
            if (!plate || typeof plate !== 'object') return '';
            return String(plate.note || '').trim();
        }

        function getPortionStockName(name) {
            return String(name ?? '').trim().replace(/^(tam|yarım|yarim)\s+porsiyon\s+/i, '').trim();
        }

        function getPortionStock(name) {
            const stockName = getPortionStockName(name);
            return portionStock[stockName] || portionStock[String(name ?? '').trim()] || null;
        }

        function setDailyMealsPayload(payload) {
            dailyMeals = payload || { items: [], text: '', date: '' };
            const textArea = document.getElementById('dailyMealsText');
            const meta = document.getElementById('dailyMealsMeta');
            if (textArea && document.activeElement !== textArea) {
                textArea.value = dailyMeals.text || '';
            }
            if (meta) {
                const count = Array.isArray(dailyMeals.items) ? dailyMeals.items.length : 0;
                meta.textContent = `${dailyMeals.date || 'Bugün'} • ${count} çeşit • Format: Kategori;Yemek;Porsiyon`;
            }
        }

        function setDailyMealsStatus(message, ok = true) {
            const status = document.getElementById('dailyMealsStatus');
            if (!status) return;
            status.textContent = message || '';
            status.style.color = ok ? '#86efac' : '#fca5a5';
        }

        async function loadDailyMeals() {
            try {
                const res = await fetch('/api/daily-meals');
                const data = await res.json();
                if (!data.success) {
                    setDailyMealsStatus(data.error || 'Günlük liste yüklenemedi', false);
                    return;
                }
                portionStock = data.portion_stock || portionStock;
                setDailyMealsPayload(data.daily_meals);
                renderPortionStock();
                setDailyMealsStatus('Günlük liste hazır');
            } catch (e) {
                setDailyMealsStatus('Günlük liste okunamadı', false);

        }

        async function saveDailyMeals() {
            const textArea = document.getElementById('dailyMealsText');
            const text = textArea ? textArea.value : '';
            setDailyMealsStatus('Kaydediliyor...');
            try {
                const res = await fetch('/api/daily-meals', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (!data.success) {
                    setDailyMealsStatus(data.error || 'Günlük liste kaydedilemedi', false);
                    return;
                }
                portionStock = data.portion_stock || {};
                portionDraft = {};
                setDailyMealsPayload(data.daily_meals);
                renderPortionStock();
                setDailyMealsStatus('Günlük liste kaydedildi');
            } catch (e) {
                setDailyMealsStatus('Sunucuya erişilemedi', false);

        renderPanelChrome();

        const portionSearch = document.getElementById('portionSearch');
        if (portionSearch) portionSearch.addEventListener('input', renderPortionStock);

        // Saat güncelleme

        }, 1000);

        socket.on('kitchen_new_order', (data) => {
            console.log('New order received:', data);
            if (Array.isArray(data?.items) && data.items.length) {
                const panelItems = data.items
                    .map(item => ({
                        ...data,
                        ...item,
                        items: undefined,
                        plate_group: item.plate_group || data.plate_group
                    }))
                    .filter(item => shouldShowOrder(item));
                if (!panelItems.length) return;

                panelItems.forEach(item => addOrderToGrid(item));

                    queuePrepTicketPrint({
                        ...data,

                        items: panelItems
                    });
                }
                playNotificationSound();
                return;
            }
            if (!shouldShowOrder(data)) {
                return;
            }

            playNotificationSound();

        socket.on('reservation_menu_notice', (data) => {
            const panelEntry = (data?.panels || []).find(panel => panel.panel === currentPanelId);
            if (!panelEntry || !Array.isArray(panelEntry.items) || !panelEntry.items.length) {
                return;
            }
            addReservationNoticeToGrid(data, panelEntry);
            playNotificationSound();
        });

        socket.on('kitchen_cancel_order', (data) => {
            console.log('Order cancelled:', data);
            let card = document.querySelector(`.order-card[data-masa="${data.masa}"]`);

            }

        socket.on('initial_data', (data) => {
            console.log('Initial data received:', data);
            menuData = data.menu || {};
            prepPanels = Array.isArray(data.prep_panels) && data.prep_panels.length ? data.prep_panels : defaultPanels;
            prepCategoryOverrides = data.prep_category_overrides || {};
            prepTicketSkipProducts = Array.isArray(data.prep_ticket_skip_products) ? data.prep_ticket_skip_products : [];
            portionStock = data.portion_stock || {};
            setDailyMealsPayload(data.daily_meals);
            renderPanelChrome();
            renderPortionStock();
            kitchenGrid.innerHTML = ''; // Temizle
            fifoSequence = 0;
            const adisyonlar = data.adisyonlar || {};
            const pendingOrders = [];

            for (const masa in adisyonlar) {
                const items = adisyonlar[masa];
                if (items && items.length > 0) {
                    items.forEach(item => {
                        if (isWaitingForKitchen(item)) {
                            const orderData = {
                                uid: item.uid,
                                masa: masa,
                                urun: item.urun,
                                kategori: item.kategori || getMenuCategoryForProduct(item.urun),
                                panel: item.panel,
                                adet: item.adet,
                                garson: item.garson,
                                not: item.not || '',
                                prep_ticket_skipped: item.prep_ticket_skipped || false,
                                plate_group: item.plate_group || null,
                                saat: item.saat || '--:--:--',
                                created_at: item.created_at || item.createdAt || item.tarih_saat || item.Tarih_Saat || ''
                            };
                            if (shouldShowOrder(orderData)) {
                                pendingOrders.push(orderData);
                            }
                        }
                    });

            }

            sortOrdersFifo(pendingOrders).forEach(orderData => addOrderToGrid(orderData, false));

        socket.on('portion_stock_update', (data) => {
            portionStock = data.portion_stock || {};
            renderPortionStock();
        });

        socket.on('daily_meals_update', (data) => {
            portionStock = data.portion_stock || portionStock;
            setDailyMealsPayload(data.daily_meals);
            renderPortionStock();
        });

        function getPortionValue(name) {
            const stockName = getPortionStockName(name);
            if (Object.prototype.hasOwnProperty.call(portionDraft, stockName)) {
                return portionDraft[stockName];
            }
            const stock = getPortionStock(name);
            return stock && stock.tracked ? stock.kalan : DEFAULT_PORTION_STOCK;
        }

        function updatePortionDraft(name, value) {
            portionDraft[getPortionStockName(name)] = String(value ?? '').trim();
        }

        function markPortionSoldOut(name) {
            portionDraft[getPortionStockName(name)] = '0';
            renderPortionStock();
        }

        function renderPortionStock() {
            const grid = document.getElementById('portionStockGrid');
            if (!grid) return;
            const query = (document.getElementById('portionSearch').value || '').trim().toLocaleLowerCase('tr-TR');
            const rows = [];
            const seen = new Set();

            (dailyMeals.items || []).forEach(item => {
                const category = String(item.kategori || '').trim();
                const stockName = String(item.yemek || '').trim();
                if (!stockName || getPanelIdForCategory(category) !== currentPanelId) return;
                if (query && !stockName.toLocaleLowerCase('tr-TR').includes(query) && !category.toLocaleLowerCase('tr-TR').includes(query)) {
                    return;
                }
                if (seen.has(stockName)) return;
                seen.add(stockName);
                const value = getPortionValue(stockName);
                const safeJsName = escapeHtml(escapeJs(stockName));
                rows.push(`
                    <div class="portion-row" data-urun="${escapeHtml(stockName)}">
                        <div class="portion-name">
                            <strong title="${escapeHtml(stockName)}">${escapeHtml(stockName)}</strong>
                            <span>${escapeHtml(category)} • günlük çeşit</span>
                        </div>
                        <input class="portion-input" type="number" min="0" step="0.5" value="${escapeHtml(value)}"
                            oninput="updatePortionDraft('${safeJsName}', this.value)">
                        <button class="portion-zero" onclick="markPortionSoldOut('${safeJsName}')">Tükendi</button>
                    </div>
                `);
            });

            grid.innerHTML = rows.length ? rows.join('') : '<div style="color:#94a3b8;padding:12px;">Bu reyonda günlük yemek bulunamadı.</div>';
        }

        async function savePortionStock() {
            const items = Object.entries(portionDraft).map(([urun, kalan]) => ({ urun, kalan }));
            if (!items.length) return;

            try {
                const res = await fetch('/api/portion-stock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items })
                });
                const data = await res.json();
                if (!data.success) {
                    alert(data.error || 'Porsiyon stokları kaydedilemedi');
                    return;
                }
                portionStock = data.portion_stock || {};
                portionDraft = {};
                renderPortionStock();
            } catch (e) {
                alert('Sunucuya erişilemedi');
            }
        }

        function getAggregateKey(data) {
            const displayInfo = getOrderTicketDisplayInfo(data);
            return `${normalizeProductKey(displayInfo.ticketAggregateProductName)}|${normalizeProductKey(displayInfo.ticketNote || '')}`;
        }

        function findAggregateCard(groupKey) {
            return Array.from(document.querySelectorAll('.order-card[data-aggregate="1"]'))
                .find(card => card.dataset.groupKey === groupKey);
        }

        function sortPortionEntries(entries) {
            return entries.sort((first, second) => {
                const firstSort = parseInt(first[2] || '99', 10);
                const secondSort = parseInt(second[2] || '99', 10);
                if (firstSort !== secondSort) return firstSort - secondSort;
                return first[0].localeCompare(second[0], 'tr-TR');
            });
        }

        function portionEntriesFromBucket(bucket) {
            return sortPortionEntries(Object.entries(bucket.portions || {}).map(([label, info]) => [
                label,
                info.adet,
                info.sort
            ]));
        }

        function formatPortionEntries(bucket) {
            return portionEntriesFromBucket(bucket)
                .map(([label, adet]) => `${label} ${formatOrderQuantity(adet)}`)
                .join(' • ');
        }

        function formatAggregateTotal(productName, note, bucket) {
            const noteText = note ? ` (${note})` : '';
            const portionText = formatPortionEntries(bucket);
            const normalTotal = bucket.normal || 0;
            const portionEntries = portionEntriesFromBucket(bucket);

            if (portionEntries.length && normalTotal <= 0) {
                if (portionEntries.length === 1) {
                    const [label, adet] = portionEntries[0];
                    return `${formatOrderQuantity(adet)}x ${label} ${productName}${noteText}`;
                }
                return `${productName}${noteText}: ${portionText}`;
            }

            if (portionEntries.length) {
                const normalText = normalTotal > 0 ? `${formatOrderQuantity(normalTotal)}x ${productName}${noteText}` : `${productName}${noteText}`;
                return `${normalText} • ${portionText}`;
            }

            return `${formatOrderQuantity(normalTotal)}x ${productName}${noteText}`;
        }

        function formatAggregateBreakdownBucket(bucket) {
            const parts = [];
            if ((bucket.normal || 0) > 0) {
                parts.push(formatOrderQuantity(bucket.normal));
            }
            const portionText = formatPortionEntries(bucket);
            if (portionText) parts.push(portionText);
            return parts.join(' • ') || '0';
        }

        function updateAggregateCard(card) {
            const sourceItems = Array.from(card.querySelectorAll('.order-card-item'));
            const productName = card.dataset.urun || '';
            const note = card.dataset.note || '';
            const byMasa = {};
            const waiters = new Set();
            const totalBucket = { normal: 0, portions: {} };

            sourceItems.forEach(el => {
                const masa = el.dataset.masa || 'Genel';
                const adet = parseOrderQuantity(el.dataset.displayAdet || el.dataset.adet, 1) || 1;
                const portionLabel = el.dataset.portionLabel || '';
                const portionSort = parseInt(el.dataset.portionSort || '99', 10);
                if (!byMasa[masa]) byMasa[masa] = { normal: 0, portions: {} };

                if (portionLabel) {
                    if (!totalBucket.portions[portionLabel]) {
                        totalBucket.portions[portionLabel] = { adet: 0, sort: portionSort };
                    }
                    if (!byMasa[masa].portions[portionLabel]) {
                        byMasa[masa].portions[portionLabel] = { adet: 0, sort: portionSort };
                    }
                    totalBucket.portions[portionLabel].adet += adet;
                    byMasa[masa].portions[portionLabel].adet += adet;
                } else {
                    totalBucket.normal += adet;
                    byMasa[masa].normal += adet;
                }
                if (el.dataset.garson) waiters.add(el.dataset.garson);
            });

            card.dataset.waiters = JSON.stringify(Array.from(waiters));
            card.dataset.totalAdet = String(totalBucket.normal + portionEntriesFromBucket(totalBucket).reduce((sum, [, adet]) => sum + adet, 0));
            card.querySelector('.aggregate-total').textContent = formatAggregateTotal(productName, note, totalBucket);
            card.querySelector('.aggregate-breakdown').textContent = Object.entries(byMasa)
                .map(([masa, bucket]) => `${masa}: ${formatAggregateBreakdownBucket(bucket)}`)
                .join(' • ');
            updateCardPartialControls(card);
        }

        function buildOrderItemHtml(data, options = {}) {
            ensureOrderFifoMetadata(data);
            const displayInfo = getOrderTicketDisplayInfo(data);
            const mealName = extractMealNameFromNote(data.not, data.urun);
            const ticketProductName = displayInfo.ticketProductName || displayInfo.productName;
            const noteParts = [];
            const plateLabel = getPlateGroupLabel(data);
            if (plateLabel) noteParts.push(plateLabel);
            const plateNote = getPlateGroupNote(data);
            if (plateNote) noteParts.push(plateNote);
            if (!mealName && data.not) noteParts.push(data.not);
            const remainingNote = noteParts.join(' / ');
            const safeUid = escapeHtml(data.uid);
            const safeAdet = escapeHtml(formatOrderQuantity(data.adet));
            const safeDisplayAdet = escapeHtml(formatOrderQuantity(displayInfo.quantity));
            const safeUrun = escapeHtml(ticketProductName);
            const safePortionLabel = escapeHtml(displayInfo.portionLabel);
            const safePortionSort = escapeHtml(String(displayInfo.portionSort));
            const safeNote = remainingNote ? ` (${escapeHtml(remainingNote)})` : '';
            const safeGarson = escapeHtml(data.garson || '?');
            const safeMasa = escapeHtml(data.masa || '');
            const safeSaat = escapeHtml(data.saat || '');
            const safeSortKey = escapeHtml(data.__fifoSortKey);
            const safeFifoSeq = escapeHtml(data.__fifoSeq);
            const label = options.showMasa
                ? `${safeDisplayAdet}x ${safeUrun}${safeNote} - ${safeMasa}`
                : `${safeDisplayAdet}x ${safeUrun}${safeNote} (${safeGarson})`;
            return `
                <div class="order-card-item" data-uid="${safeUid}" data-adet="${safeAdet}" data-display-adet="${safeDisplayAdet}"
                    data-portion-label="${safePortionLabel}" data-portion-sort="${safePortionSort}"
                    data-masa="${safeMasa}" data-garson="${safeGarson}"
                    data-saat="${safeSaat}" data-sort-key="${safeSortKey}" data-fifo-seq="${safeFifoSeq}"
                    onclick="toggleOrderItemSelection(this, event)">
                    <div class="order-card-item-main">
                        <span class="order-card-check">□</span>
                        <span>${label}</span>
                    </div>
                    <button class="btn-item-ready" type="button" onclick="completeItem(this, event)">Hazır</button>
                </div>
            `;
        }

        function getOrderActionsHtml(cardId, allLabel = 'TÜMÜ HAZIR') {
            return `
                <button class="btn btn-kitchen-selected" onclick="completeSelectedItems('${cardId}')" disabled>SEÇİLENLER HAZIR</button>
                <button class="btn btn-kitchen-done" onclick="completeOrder('${cardId}')">${allLabel}</button>
            `;
        }

        function toggleOrderItemSelection(itemEl, event) {
            if (!itemEl || event?.target?.closest('button')) return;
            itemEl.classList.toggle('selected');
            const check = itemEl.querySelector('.order-card-check');
            if (check) check.textContent = itemEl.classList.contains('selected') ? '✓' : '□';
            updateCardPartialControls(itemEl.closest('.order-card'));
        }

        function updateCardPartialControls(card) {
            if (!card) return;
            const selectedCount = card.querySelectorAll('.order-card-item.selected').length;
            const selectedBtn = card.querySelector('.btn-kitchen-selected');
            if (!selectedBtn) return;
            selectedBtn.disabled = selectedCount === 0;
            selectedBtn.textContent = selectedCount > 0 ? `SEÇİLENLER HAZIR (${selectedCount})` : 'SEÇİLENLER HAZIR';
        }

        function completeItem(button, event) {
            if (event) event.stopPropagation();
            const itemEl = button?.closest('.order-card-item');
            const card = itemEl?.closest('.order-card');
            const uid = itemEl?.dataset.uid;
            if (!card || !uid) return;
            completeOrder(card.id, [uid]);
        }

        function completeSelectedItems(id) {
            const card = document.getElementById(id);
            if (!card) return;
            const itemUids = Array.from(card.querySelectorAll('.order-card-item.selected'))
                .map(el => el.dataset.uid)
                .filter(Boolean);
            if (!itemUids.length) return;
            completeOrder(id, itemUids);
        }

        function removeCompletedItemsFromCard(card, itemUids) {
            if (!card) return;
            const uidSet = new Set(itemUids || []);
            const allItems = Array.from(card.querySelectorAll('.order-card-item'));
            const completedItems = allItems.filter(el => uidSet.has(el.dataset.uid));
            completedItems.forEach(el => {
                el.classList.add('completed');
                setTimeout(() => {
                    el.remove();
                    if (card.querySelectorAll('.order-card-item').length === 0) {
                        card.style.transform = 'scale(0.8)';
                        card.style.opacity = '0';
                        setTimeout(() => card.remove(), 250);
                    } else {
                        if (card.dataset.aggregate === '1') {
                            updateAggregateCard(card);
                        }
                        updateCardPartialControls(card);
                        syncCardFifoMetadata(card);
                    }
                }, 220);
            });
        }

        function addAggregateOrderToGrid(data, showNewEffect = true) {
            ensureOrderFifoMetadata(data);
            const groupKey = getAggregateKey(data);
            let card = findAggregateCard(groupKey);
            const addHiddenItem = (targetCard) => {
                const itemsContainer = targetCard.querySelector('.order-card-items');
                itemsContainer.insertAdjacentHTML('beforeend', buildOrderItemHtml(data, { showMasa: true }));
            };

            if (card) {
                addHiddenItem(card);
                updateAggregateCard(card);
                syncCardFifoMetadata(card);
                if (showNewEffect) {
                    card.classList.add('new');
                    setTimeout(() => card.classList.remove('new'), 5000);
                }
                return;
            }

            card = document.createElement('div');
            card.className = showNewEffect ? 'order-card new' : 'order-card';
            card.dataset.aggregate = '1';
            card.dataset.groupKey = groupKey;
            const displayInfo = getOrderTicketDisplayInfo(data);
            card.dataset.urun = displayInfo.ticketAggregateProductName;
            card.dataset.note = displayInfo.ticketNote || '';
            card.dataset.panel = currentPanelId;
            const cardId = `order-agg-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            card.id = cardId;

            card.innerHTML = `
                <div class="order-card-header">
                    <span class="order-card-masa">${escapeHtml(currentPanel().name)}</span>
                    <span class="order-card-time">${escapeHtml(data.saat)}</span>
                </div>
                <div class="aggregate-total"></div>
                <div class="aggregate-breakdown"></div>
                <div class="order-card-items aggregate-source-items"></div>
                <div class="order-card-actions">
                    ${getOrderActionsHtml(cardId)}
                </div>
            `;

            addHiddenItem(card);
            updateAggregateCard(card);
            syncCardFifoMetadata(card);
            if (showNewEffect) {
                setTimeout(() => card.classList.remove('new'), 5000);
            }
        }

        function addOrderToGrid(data, showNewEffect = true) {
            ensureOrderFifoMetadata(data);
            if (currentPanel().aggregate) {
                addAggregateOrderToGrid(data, showNewEffect);
                return;
            }

            // Mevcut kartı ara (masa bazlı)
            let card = document.querySelector(`.order-card[data-masa="${data.masa}"]`);

            if (card) {
                // Kart bulundu, içine yeni ürünü ekle
                const itemsContainer = card.querySelector('.order-card-items');
                itemsContainer.insertAdjacentHTML('beforeend', buildOrderItemHtml(data));

                // Garsonları güncelle
                if (data.garson) {
                    let waiters = JSON.parse(card.dataset.waiters || '[]');
                    if (!waiters.includes(data.garson)) {
                        waiters.push(data.garson);
                        card.dataset.waiters = JSON.stringify(waiters);
                    }
                }

                syncCardFifoMetadata(card);

                if (showNewEffect) {
                    card.classList.add('new');
                    setTimeout(() => card.classList.remove('new'), 5000);
                }
            } else {
                // Kart bulunamadı, yeni kart oluştur
                card = document.createElement('div');
                card.className = showNewEffect ? 'order-card new' : 'order-card';
                card.dataset.masa = data.masa;
                const initialWaiters = data.garson ? [data.garson] : [];
                card.dataset.waiters = JSON.stringify(initialWaiters);

                const cardId = `order-${data.masa.replace(/\s+/g, '-')}`;
                card.id = cardId;
                const safeMasa = escapeHtml(data.masa);
                const safeSaat = escapeHtml(data.saat);

                card.innerHTML = `
                    <div class="order-card-header">
                        <span class="order-card-masa">${safeMasa}</span>
                        <span class="order-card-time">${safeSaat}</span>
                    </div>
                    <div class="order-card-items">
                        ${buildOrderItemHtml(data)}
                    </div>
                    <div class="order-card-actions">
                        ${getOrderActionsHtml(cardId)}
                    </div>
                `;

                syncCardFifoMetadata(card);
                if (showNewEffect) {
                    setTimeout(() => card.classList.remove('new'), 5000);
                }
            }
        }

        function formatReservationNoticeItem(item) {
            const qty = formatOrderQuantity(item.adet || 1);
            const note = item.not ? ` (${escapeHtml(item.not)})` : '';
            return `<div class="reservation-notice-item">${escapeHtml(qty)}x ${escapeHtml(item.urun || '')}${note}</div>`;
        }

        function addReservationNoticeToGrid(data, panelEntry) {
            const id = `reservation-notice-${String(data.id || Date.now()).replace(/[^a-zA-Z0-9_-]/g, '')}-${currentPanelId}`;
            const existing = document.getElementById(id);
            if (existing) existing.remove();

            const card = document.createElement('div');
            card.id = id;
            card.className = 'reservation-notice-card';
            const meta = [
                data.date,
                data.time,
                data.masa,
                data.guest_count ? `${data.guest_count} kişi` : '',
                data.phone
            ].filter(Boolean).join(' • ');
            const items = (panelEntry.items || []).map(formatReservationNoticeItem).join('');
            card.innerHTML = `
                <div class="reservation-notice-head">
                    <div>
                        <div class="reservation-notice-title">REZERVASYON MENÜSÜ - ${escapeHtml(data.customer_name || '')}</div>
                        <div class="reservation-notice-meta">${escapeHtml(meta)}</div>
                    </div>
                    <button class="btn btn-kitchen-all" type="button" onclick="this.closest('.reservation-notice-card').remove()">KAPAT</button>
                </div>
                <div class="reservation-notice-items">${items}</div>
                ${data.note ? `<div class="reservation-notice-note">Not: ${escapeHtml(data.note)}</div>` : ''}
            `;
            kitchenGrid.prepend(card);
        }

        function completeOrder(id, explicitItemUids = null) {
            const card = document.getElementById(id);
            if (card) {
                const isAggregate = card.dataset.aggregate === '1';
                const masa = isAggregate ? null : card.dataset.masa;
                const itemsUids = explicitItemUids || Array.from(card.querySelectorAll('.order-card-item'))
                        .map(el => el.dataset.uid)
                        .filter(Boolean);
                if (!itemsUids.length) return;
                const uidSet = new Set(itemsUids);
                const selectedWaiters = Array.from(card.querySelectorAll('.order-card-item'))
                    .filter(el => uidSet.has(el.dataset.uid))
                    .map(el => el.dataset.garson)
                    .filter(Boolean);
                const waiters = Array.from(new Set(selectedWaiters.length ? selectedWaiters : JSON.parse(card.dataset.waiters || '[]')));

                // Sunucuya bildir
                socket.emit('kitchen_order_ready', {
                    masa: masa,
                    panel: currentPanelId,
                    waiters: waiters,
                    items_uids: itemsUids
                });

                removeCompletedItemsFromCard(card, itemsUids);
            }
        }

        function extractMealNameFromNote(note, urun) {
            if (!note) return null;
            const match = String(note).match(/^Yemek:\s*(.+)$/i);
            if (!match) return null;
            const mealName = match[1].trim();
            return prepTicketMealDisplayName(urun, mealName);
        }

        function cleanPrepTicketNote(note) {
            return String(note ?? '').trim().replace(/^(not|yemek|çeşit|cesit)\s*:\s*/i, '').trim();
        }

        function prepPrintGroupValue(value) {
            return normalizeTextForMatch(value).replace(/\s+/g, ' ').trim();
        }

        function shouldBatchPrepPrint(data) {
            const panelId = getOrderPanelId(data);
            const panel = prepPanels.find(panelItem => panelItem.id === panelId) || currentPanel();
            return Boolean(panel && panel.aggregate) || panelId === 'icecek';
        }

        function prepPrintBatchKey(data) {
            return `${getOrderPanelId(data)}|${String(data?.masa ?? '').trim()}`;
        }

        function queuePrepTicketPrint(data) {
            if (!shouldBatchPrepPrint(data)) {
                printOrder(data);
                return;
            }

            const key = prepPrintBatchKey(data);
            let batch = prepPrintBatches.get(key);
            const item = {
                ...data,
                not: data.not || '',
                kategori: data.kategori || getMenuCategoryForProduct(data.urun),
                panel: data.panel || getOrderPanelId(data)
            };

            if (!batch) {
                batch = {
                    payload: {
                        ...data,
                        items: []
                    },
                    timer: null
                };
                prepPrintBatches.set(key, batch);
            }

            batch.payload.items.push(item);
            batch.payload.saat = data.saat || batch.payload.saat;
            if (data.garson) {
                const currentGarson = batch.payload.garson || '';
                if (!currentGarson) {
                    batch.payload.garson = data.garson;
                } else if (!currentGarson.split(' / ').includes(data.garson)) {
                    batch.payload.garson = `${currentGarson} / ${data.garson}`;
                }
            }

            if (batch.timer) clearTimeout(batch.timer);
            batch.timer = setTimeout(() => flushPrepTicketPrintBatch(key), PRINT_BATCH_DELAY_MS);
        }

        function flushPrepTicketPrintBatch(key) {
            const batch = prepPrintBatches.get(key);
            if (!batch) return;
            prepPrintBatches.delete(key);
            if (autoPrintToggle.checked) {
                printOrder(batch.payload);
            }
        }

        function getPrepPrintItemParts(raw, parentData = {}) {
            const data = {
                ...parentData,
                ...raw
            };
            if (!data.kategori) data.kategori = getMenuCategoryForProduct(data.urun);
            if (!data.panel) data.panel = getOrderPanelId(data);
            const displayInfo = getOrderTicketDisplayInfo(data);
            const productName = displayInfo.ticketProductName || displayInfo.productName;
            const note = [
                displayInfo.ticketNote ? cleanPrepTicketNote(displayInfo.ticketNote) : ''
            ].filter(Boolean).join(' / ');
            const parsedQuantity = parseOrderQuantity(displayInfo.quantity, 1);
            const quantity = parsedQuantity > 0 ? parsedQuantity : 1;
            const key = [
                data.panel,
                data.kategori,
                productName,
                displayInfo.portionLabel,
                note
            ].map(prepPrintGroupValue).join('|');
            return {
                key,
                productName,
                note,
                quantity
            };
        }

        function getPrepPrintItems(data) {
            const hasChildItems = Array.isArray(data.items) && data.items.length;
            const rawItems = hasChildItems ? data.items : [data];

            function rawPlateGroup(raw) {
                if (raw?.plate_group && typeof raw.plate_group === 'object') return raw.plate_group;
                if (!hasChildItems && data?.plate_group && typeof data.plate_group === 'object') return data.plate_group;
                return null;
            }

            function rawPlateHeading(raw) {
                const plate = rawPlateGroup(raw);
                if (!plate) return '';
                const label = getPlateGroupLabel({ plate_group: plate });
                const note = getPlateGroupNote({ plate_group: plate });
                return [label, note].filter(Boolean).join(' / ');
            }

            function samePlatePrintHeading(detail) {
                const text = String(detail || '').trim();
                const match = text.match(/^(?:tek\s+tabak|tabak)\s+(#\S+)$/i);
                if (match) return `AYNI TABAK ${match[1]}`;
                return text ? `AYNI TABAK: ${text}` : '';
            }

            const hasPlateItems = rawItems.some(raw => raw?.urun && rawPlateHeading(raw));
            const sections = [];
            const sectionMap = new Map();

            rawItems.forEach(raw => {
                const plateHeading = rawPlateHeading(raw);
                const sectionKey = plateHeading ? `plate:${prepPrintGroupValue(plateHeading)}` : 'normal';
                if (!sectionMap.has(sectionKey)) {
                    const heading = plateHeading ? samePlatePrintHeading(plateHeading) : (hasPlateItems ? 'AYRI SERVİS' : '');
                    const section = {
                        heading,
                        items: [],
                        groupedIndex: new Map()
                    };
                    sectionMap.set(sectionKey, section);
                    sections.push(section);
                }

                const item = getPrepPrintItemParts(raw, data);
                if (!item.productName) return;
                if (plateHeading && prepPrintGroupValue(item.productName) === prepPrintGroupValue(plateHeading) && !item.note) {
                    return;
                }
                const section = sectionMap.get(sectionKey);
                if (section.groupedIndex.has(item.key)) {
                    section.items[section.groupedIndex.get(item.key)].quantity += item.quantity;
                    return;
                }
                section.groupedIndex.set(item.key, section.items.length);
                section.items.push(item);
            });

            const grouped = [];
            sections.forEach(section => {
                if (section.heading) grouped.push({ heading: section.heading });
                grouped.push(...section.items);
                if (section.heading && section.heading.startsWith('AYNI TABAK') && section.items.length) {
                    grouped.push({ separator: true });
                }
            });
            return grouped;
        }

        function formatPrepPrintItemLine(item) {
            if (item.separator) return '--------------------------------';
            if (item.heading) return item.heading;
            const noteText = item.note ? ` ${item.note}` : '';
            return `${formatOrderQuantity(item.quantity)} x ${item.productName}${noteText}`;
        }

        function printOrder(data) {
            const printArea = document.getElementById('printArea');
            const ticketItems = getPrepPrintItems(data);
            const itemsHtml = ticketItems.length
                ? ticketItems.map(item => `
                        <div style="margin: 6px 0;">${escapeHtml(formatPrepPrintItemLine(item))}</div>
                    `).join('')
                : '<div style="margin: 6px 0;">SİPARİŞ</div>';
            printArea.innerHTML = `
                <div style="text-align: center; font-family: 'Courier New', monospace; width: 80mm; padding: 10px; color: black; background: white;">
                    <h2 style="margin: 0;">${escapeHtml(currentPanel().ticket_title || 'SİPARİŞ FİŞİ')}</h2>
                    <hr>
                    <h1 style="margin: 10px 0;">${escapeHtml(data.masa)}</h1>
                    <div style="text-align: left; font-size: 20px; font-weight: bold;">
                        ${itemsHtml}
                    </div>
                    <hr>
                    <div style="font-size: 12px;">${escapeHtml(data.saat)}</div>
                </div>
            `;
            window.print();
        }

        function playNotificationSound() {
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play().catch(e => console.log('Audio play failed:', e));
        }
    </script>

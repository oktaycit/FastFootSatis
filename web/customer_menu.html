<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liva Restoran Menü</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d7422f'/%3E%3Ctext x='32' y='43' font-size='36' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'%3EL%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #fff7f2;
            --surface: #ffffff;
            --surface-soft: #fff1e8;
            --ink: #202126;
            --muted: #6c717b;
            --line: #eadbd2;
            --brand: #d7422f;
            --brand-dark: #9f281f;
            --brand-soft: #ffe4d9;
            --teal: #117c73;
            --teal-soft: #e4f5f2;
            --gold: #d99a21;
            --slate: #303944;
            --danger: #b42318;
            --radius: 8px;
            --shadow: 0 12px 28px rgba(45, 34, 28, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(135deg, rgba(215, 66, 47, 0.10), transparent 34%),
                linear-gradient(315deg, rgba(17, 124, 115, 0.10), transparent 32%),
                var(--bg);
        }

        body::before {
            content: "LIVA  LIVA  LIVA  LIVA";
            position: fixed;
            inset: 0;
            z-index: -1;
            color: rgba(215, 66, 47, 0.055);
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 16px;
            line-height: 88px;
            transform: rotate(-11deg) scale(1.25);
            transform-origin: center;
            white-space: pre-wrap;
            word-spacing: 28px;
            pointer-events: none;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            width: min(1180px, calc(100% - 24px));
            margin: 0 auto;
            padding: 18px 0 28px;
        }

        .hero {
            position: sticky;
            top: 10px;
            z-index: 20;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            min-height: 124px;
            padding: 18px;
            color: #fff;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.24), transparent 54%),
                repeating-linear-gradient(-14deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 42px),
                var(--brand);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .hero::after {
            content: "LIVA";
            position: absolute;
            right: 18px;
            bottom: -35px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 112px;
            font-weight: 900;
            letter-spacing: 8px;
            pointer-events: none;
        }

        .brand {
            position: relative;
            display: flex;
            gap: 14px;
            align-items: center;
            min-width: 0;
        }

        .brand-mark {
            width: 58px;
            height: 58px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            color: var(--brand);
            background: #fff;
            border-radius: 18px 18px 18px 4px;
            font-size: 36px;
            font-weight: 900;
            line-height: 1;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
        }

        .brand-title {
            min-width: 0;
        }

        .brand-title h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1;
            letter-spacing: 0;
            font-weight: 900;
        }

        .brand-title p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.86);
            font-size: 14px;
            font-weight: 650;
        }

        .hero-badges {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 7px 11px;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.26);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .badge.light {
            color: var(--brand-dark);
            background: #fff;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 14px;
            align-items: start;
            margin-top: 14px;
        }

        .layout.browse {
            grid-template-columns: minmax(0, 1fr) 280px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 10px 22px rgba(43, 32, 27, 0.08);
        }

        .menu-panel {
            padding: 14px;
        }

        .tools {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 168px;
            gap: 8px;
            margin-bottom: 10px;
        }

        .field {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px 12px;
            background: #fff;
            color: var(--ink);
            outline: none;
        }

        .field:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(215, 66, 47, 0.14);
        }

        .tabs {
            position: sticky;
            top: 154px;
            z-index: 15;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0 10px;
            background: rgba(255, 255, 255, 0.96);
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 0 0 auto;
            min-height: 36px;
            padding: 8px 13px;
            color: var(--brand-dark);
            background: var(--brand-soft);
            border: 1px solid rgba(215, 66, 47, 0.2);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 850;
        }

        .tab.active {
            color: #fff;
            background: var(--slate);
            border-color: var(--slate);
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 12px;
            margin: 4px 0 10px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 20px;
            line-height: 1.15;
            letter-spacing: 0;
        }

        .section-head span {
            color: var(--muted);
            font-size: 12px;
            font-weight: 750;
            white-space: nowrap;
        }

        .recommendations {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0 10px;
            scrollbar-width: none;
        }

        .recommendations::-webkit-scrollbar {
            display: none;
        }

        .reco-chip {
            flex: 0 0 auto;
            min-height: 34px;
            border: 1px solid rgba(17, 124, 115, 0.24);
            border-radius: 999px;
            padding: 7px 11px;
            color: #095851;
            background: var(--teal-soft);
            font-size: 12px;
            font-weight: 850;
        }

        .items {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .item {
            display: grid;
            grid-template-columns: 70px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            min-height: 92px;
            padding: 10px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        .item.sold-out {
            opacity: 0.62;
        }

        .item-visual {
            width: 70px;
            height: 70px;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #fff;
            background: var(--item-color, var(--brand));
            border-radius: var(--radius);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0;
        }

        .item-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item-title {
            min-width: 0;
        }

        .item h3 {
            margin: 0 0 6px;
            font-size: 15px;
            line-height: 1.18;
            letter-spacing: 0;
        }

        .price {
            color: var(--brand-dark);
            font-size: 15px;
            font-weight: 900;
        }

        .item-note {
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        .stock-pill {
            display: inline-flex;
            margin-top: 6px;
            padding: 3px 7px;
            color: #075c54;
            background: var(--teal-soft);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
        }

        .stock-pill.low {
            color: #7a3d00;
            background: #fff1ce;
        }

        .stock-pill.empty {
            color: var(--danger);
            background: #ffe3df;
        }

        .btn {
            min-height: 40px;
            border: 0;
            border-radius: var(--radius);
            padding: 9px 12px;
            font-weight: 900;
            background: #eef0f3;
            color: var(--ink);
        }

        .btn-main {
            color: #fff;
            background: var(--brand);
        }

        .btn-main:disabled {
            opacity: 0.62;
            cursor: not-allowed;
        }

        .btn-danger {
            color: #fff;
            background: var(--danger);
        }

        .side-panel {
            position: sticky;
            top: 154px;
            padding: 14px;
        }

        .side-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .side-title h2 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 0;
        }

        .table-token {
            min-width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            color: #fff;
            background: var(--brand);
            border-radius: var(--radius);
            font-size: 24px;
            font-weight: 950;
        }

        .cart-list {
            display: grid;
            gap: 8px;
            max-height: 300px;
            overflow: auto;
            margin-bottom: 10px;
        }

        .cart-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            padding: 9px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: 13px;
        }

        .cart-row strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .total {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 8px 0 12px;
            padding: 12px;
            color: #fff;
            background: var(--slate);
            border-radius: var(--radius);
            font-weight: 900;
        }

        .total span:last-child {
            font-size: 22px;
        }

        .status {
            min-height: 20px;
            margin-top: 10px;
            color: #7a3d00;
            font-size: 12px;
            font-weight: 800;
            line-height: 1.4;
        }

        .status.ok {
            color: #0c6a55;
        }

        .verify,
        .online-form,
        .browse-note {
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
            padding: 10px;
            background: var(--surface-soft);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        .browse-note {
            background: linear-gradient(135deg, #fff, var(--brand-soft));
        }

        .browse-note p,
        .online-form p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .verify-row {
            display: flex;
            gap: 8px;
        }

        .online-form label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 850;
        }

        .pay-choice {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .pay-btn {
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #fff;
            color: var(--ink);
            font-weight: 850;
        }

        .pay-btn.selected-nakit {
            border-color: var(--teal);
            color: #075c54;
            background: var(--teal-soft);
        }

        .pay-btn.selected-kart {
            border-color: #5065d8;
            color: #2938a8;
            background: #eef0ff;
        }

        .success-screen {
            display: none;
            padding: 20px 10px;
            text-align: center;
        }

        .success-mark {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            margin: 0 auto 12px;
            color: #fff;
            background: var(--teal);
            border-radius: 50%;
            font-size: 34px;
            font-weight: 900;
        }

        .success-screen h3 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .success-screen p {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .empty {
            padding: 22px;
            color: var(--muted);
            background: #fff;
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            text-align: center;
            font-weight: 750;
        }

        @media (max-width: 980px) {
            .hero,
            .layout,
            .layout.browse {
                grid-template-columns: 1fr;
            }

            .hero {
                position: static;
            }

            .hero-badges {
                justify-content: flex-start;
            }

            .tabs,
            .side-panel {
                position: static;
            }
        }

        @media (max-width: 720px) {
            .page {
                width: min(100% - 16px, 1180px);
                padding-top: 8px;
            }

            .hero {
                min-height: 112px;
                padding: 14px;
            }

            .brand-mark {
                width: 50px;
                height: 50px;
                font-size: 31px;
            }

            .brand-title h1 {
                font-size: 25px;
            }

            .brand-title p {
                font-size: 13px;
            }

            .tools {
                grid-template-columns: 1fr;
            }

            .items {
                grid-template-columns: 1fr;
            }

            .item {
                grid-template-columns: 62px minmax(0, 1fr) auto;
            }

            .item-visual {
                width: 62px;
                height: 62px;
                font-size: 18px;
            }

            .pay-choice,
            .verify-row {
                grid-template-columns: 1fr;
                display: grid;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="hero">
            <div class="brand">
                <div class="brand-mark">L</div>
                <div class="brand-title">
                    <h1>LİVA</h1>
                    <p>Restoran menüsü</p>
                </div>
            </div>
            <div class="hero-badges">
                <span class="badge light" id="tableInfo">Menü</span>
                <span class="badge" id="modeBadge">QR Menü</span>
                <span class="badge" id="itemCountBadge">0 ürün</span>
            </div>
        </header>

        <main class="layout browse" id="layout">
            <section class="panel menu-panel">
                <div class="tools">
                    <input class="field" id="searchInput" placeholder="Ürün ara" autocomplete="off">
                    <select class="field" id="sortSelect" aria-label="Sıralama">
                        <option value="recommended">Öne çıkanlar</option>
                        <option value="price_asc">Fiyat artan</option>
                        <option value="price_desc">Fiyat azalan</option>
                        <option value="name_asc">İsim A-Z</option>
                    </select>
                </div>
                <div class="recommendations" id="recoRow"></div>
                <nav class="tabs" id="catTabs" aria-label="Menü kategorileri"></nav>
                <div class="section-head">
                    <h2 id="categoryTitle">Menü</h2>
                    <span id="categoryCount"></span>
                </div>
                <div class="items" id="menuRoot"></div>
            </section>

            <aside class="panel side-panel" id="sidePanel">
                <div class="side-title">
                    <h2 id="sideTitle">Liva Menü</h2>
                    <div class="table-token" id="tableToken">L</div>
                </div>

                <div class="browse-note" id="browsePanel">
                    <strong>QR Menü</strong>
                    <p id="browseText">Liva ürünleri ve güncel fiyatlar.</p>
                </div>

                <div class="success-screen" id="successScreen">
                    <div class="success-mark">✓</div>
                    <h3>Sipariş alındı</h3>
                    <p id="successSub">En kısa sürede hazırlanacak.</p>
                    <button class="btn" style="width:100%;" onclick="resetAfterOrder()">Yeni sipariş</button>
                </div>

                <div id="orderPanel">
                    <div class="verify" id="tableModePanel">
                        <strong>Masa doğrulama</strong>
                        <div class="verify-row" id="qrRow">
                            <input class="field" id="qrTokenInput" placeholder="QR token">
                            <button class="btn" id="btnVerify">QR</button>
                        </div>
                        <div class="verify-row" id="nfcRow">
                            <input class="field" id="nfcUidInput" placeholder="NFC UID">
                            <button class="btn" id="btnVerifyNfc">NFC</button>
                        </div>
                        <button class="btn" id="btnReadNfc">Telefondan NFC oku</button>
                    </div>

                    <div class="online-form" id="onlineModePanel">
                        <strong>Teslimat bilgileri</strong>
                        <label for="onlineAd">Ad Soyad</label>
                        <input class="field" id="onlineAd" autocomplete="name">
                        <label for="onlineTel">Telefon</label>
                        <input class="field" id="onlineTel" type="tel" autocomplete="tel" inputmode="tel">
                        <label for="onlineAdres">Adres</label>
                        <textarea class="field" id="onlineAdres" rows="3"></textarea>
                        <label for="onlineNot">Not</label>
                        <input class="field" id="onlineNot">
                        <label>Ödeme</label>
                        <div class="pay-choice">
                            <button class="pay-btn selected-nakit" id="payNakit" onclick="selectOdeme('nakit')">Nakit</button>
                            <button class="pay-btn" id="payKart" onclick="selectOdeme('kart')">Kart</button>
                        </div>
                    </div>

                    <div class="cart-list" id="cartRoot"></div>
                    <div class="total" id="cartTotal">
                        <span>Toplam</span>
                        <span>0.00 TL</span>
                    </div>
                    <button class="btn btn-main" style="width:100%;" id="btnOrder">Siparişi gönder</button>
                </div>

                <div class="status" id="verifyStatus">Menü yükleniyor...</div>
            </aside>
        </main>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mode = (params.get('mode') || '').trim().toLowerCase();
        const tableHint = (params.get('table_hint') || params.get('table') || '').trim();
        const tokenFromUrl = (params.get('qr_token') || '').trim();
        const isOnlineMode = mode === 'online';
        const isOrderMode = isOnlineMode || !!tokenFromUrl || mode === 'order' || params.get('order') === '1';
        const isBrowseMode = !isOrderMode;

        const categoryColors = ['#d7422f', '#117c73', '#303944', '#d99a21', '#7b3f98', '#2f80ed'];
        const categoryNotes = {
            'Çorbalar': 'Sıcak servis edilir',
            'Köfte & Piyaz': 'Liva mutfağından',
            'Tatlılar': 'Günlük tatlı seçkisi',
            'İçecekler': 'Soğuk servis'
        };

        const state = {
            menu: {},
            portionStock: {},
            categories: [],
            activeCategory: null,
            searchQuery: '',
            sortMode: 'recommended',
            cart: {},
            sessionToken: localStorage.getItem('public_session_token') || '',
            tableName: tableHint,
            verified: false,
            orderPrefs: JSON.parse(localStorage.getItem('menu_order_prefs') || '{}'),
            odeme_tipi: 'nakit',
            policy: {
                verify_mode: 'hybrid',
                verify_required: true,
                allow_dynamic_qr: true,
                allow_nfc: true
            }
        };

        const el = {
            layout: document.getElementById('layout'),
            tableInfo: document.getElementById('tableInfo'),
            modeBadge: document.getElementById('modeBadge'),
            itemCountBadge: document.getElementById('itemCountBadge'),
            searchInput: document.getElementById('searchInput'),
            sortSelect: document.getElementById('sortSelect'),
            recoRow: document.getElementById('recoRow'),
            catTabs: document.getElementById('catTabs'),
            categoryTitle: document.getElementById('categoryTitle'),
            categoryCount: document.getElementById('categoryCount'),
            menuRoot: document.getElementById('menuRoot'),
            tableToken: document.getElementById('tableToken'),
            browsePanel: document.getElementById('browsePanel'),
            browseText: document.getElementById('browseText'),
            orderPanel: document.getElementById('orderPanel'),
            tableModePanel: document.getElementById('tableModePanel'),
            onlineModePanel: document.getElementById('onlineModePanel'),
            qrTokenInput: document.getElementById('qrTokenInput'),
            nfcUidInput: document.getElementById('nfcUidInput'),
            btnVerify: document.getElementById('btnVerify'),
            btnVerifyNfc: document.getElementById('btnVerifyNfc'),
            btnReadNfc: document.getElementById('btnReadNfc'),
            cartRoot: document.getElementById('cartRoot'),
            cartTotal: document.getElementById('cartTotal'),
            btnOrder: document.getElementById('btnOrder'),
            verifyStatus: document.getElementById('verifyStatus'),
            successScreen: document.getElementById('successScreen')
        };

        function initMode() {
            if (tableHint) {
                el.tableInfo.textContent = `Masa ${tableHint}`;
                el.tableToken.textContent = tableHint.slice(0, 3).toUpperCase();
                el.browseText.textContent = `Masa ${tableHint} için Liva menüsü.`;
            }
            if (isBrowseMode) {
                el.layout.classList.add('browse');
                el.modeBadge.textContent = 'QR Menü';
                el.orderPanel.style.display = 'none';
                setStatus('Menü görüntüleniyor', true);
            } else {
                el.layout.classList.remove('browse');
                el.browsePanel.style.display = 'none';
                el.orderPanel.style.display = 'block';
                if (isOnlineMode) {
                    el.modeBadge.textContent = 'Online Sipariş';
                    el.tableInfo.textContent = 'Teslimat';
                    el.tableToken.textContent = 'L';
                    el.tableModePanel.style.display = 'none';
                    el.onlineModePanel.style.display = 'grid';
                    setStatus('Teslimat modu', true);
                } else {
                    el.modeBadge.textContent = 'Masa Siparişi';
                    el.tableModePanel.style.display = 'grid';
                    el.onlineModePanel.style.display = 'none';
                    if (tokenFromUrl) el.qrTokenInput.value = tokenFromUrl;
                }
            }
        }

        window.selectOdeme = function (tip) {
            state.odeme_tipi = tip;
            document.getElementById('payNakit').className = 'pay-btn' + (tip === 'nakit' ? ' selected-nakit' : '');
            document.getElementById('payKart').className = 'pay-btn' + (tip === 'kart' ? ' selected-kart' : '');
        };

        function fingerprint() {
            const raw = [navigator.userAgent, navigator.language, screen.width, screen.height, Intl.DateTimeFormat().resolvedOptions().timeZone].join('|');
            return btoa(unescape(encodeURIComponent(raw))).slice(0, 180);
        }

        function setStatus(message, ok = false) {
            el.verifyStatus.textContent = message;
            el.verifyStatus.classList.toggle('ok', !!ok);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJs(value) {
            return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function getItemName(item) {
            return String(item[0] || '').trim();
        }

        function getItemPrice(item) {
            return Number(item[1] || 0);
        }

        function getItemImageUrl(item) {
            const candidate = item[6] || item[7];
            if (typeof candidate !== 'string') return null;
            const trimmed = candidate.trim();
            if (!trimmed) return null;
            if (trimmed.startsWith('http://') || trimmed.startsWith('https://') || trimmed.startsWith('/')) return trimmed;
            return null;
        }

        function isMenuItemVisible(item) {
            if (!Array.isArray(item) || item.length <= 7) return true;
            const value = item[7];
            if (typeof value === 'boolean') return value;
            return !['0', 'false', 'hayir', 'hayır', 'no', 'off'].includes(String(value).trim().toLowerCase());
        }

        function getVisibleMenu(menu) {
            const next = {};
            Object.entries(menu || {}).forEach(([cat, items]) => {
                const visibleItems = (items || []).filter(isMenuItemVisible);
                if (visibleItems.length) next[cat] = visibleItems;
            });
            return next;
        }

        function getPortionStock(name) {
            const stockName = getPortionStockName(name);
            return state.portionStock[stockName] || state.portionStock[String(name || '').trim()] || null;
        }

        function getPortionStockName(name) {
            return String(name || '').trim().replace(/^(tam|yarım|yarim)\s+porsiyon\s+/i, '').trim();
        }

        function getPortionUnits(name, adet = 1) {
            const normalized = String(name || '').trim().toLocaleLowerCase('tr-TR');
            const multiplier = /^(yarım|yarim)\s+porsiyon\s+/.test(normalized) ? 0.5 : 1;
            return Number(adet || 1) * multiplier;
        }

        function formatPortionAmount(value) {
            const amount = Number(value || 0);
            return Number.isInteger(amount) ? String(amount) : String(amount).replace('.', ',');
        }

        function isSoldOutItem(item) {
            const stock = getPortionStock(getItemName(item));
            return !!(stock && stock.tracked && Number(stock.kalan || 0) <= 0);
        }

        function getCartQtyForName(name) {
            const stockName = getPortionStockName(name);
            return Object.values(state.cart).reduce((sum, item) => {
                return sum + (getPortionStockName(item.urun) === stockName ? getPortionUnits(item.urun, item.adet) : 0);
            }, 0);
        }

        function getInitials(name) {
            const parts = String(name).trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return 'L';
            return parts.slice(0, 2).map(part => part[0]).join('').toUpperCase();
        }

        function getCategoryColor(cat) {
            const idx = Math.max(0, state.categories.indexOf(cat));
            return categoryColors[idx % categoryColors.length];
        }

        function getRecommendedScore(item) {
            const name = getItemName(item);
            const price = getItemPrice(item);
            const pref = Number(state.orderPrefs[name] || 0);
            const platformBoost = Number(item[2] || 0) + Number(item[3] || 0) + Number(item[4] || 0) + Number(item[5] || 0);
            const priceBoost = price > 0 ? Math.max(0, 120 / price) : 0;
            return pref * 5 + platformBoost + priceBoost;
        }

        function getVisibleItemsForCategory(cat) {
            const items = (state.menu[cat] || []).slice();
            const q = state.searchQuery.toLocaleLowerCase('tr-TR');
            let visible = q ? items.filter(item => getItemName(item).toLocaleLowerCase('tr-TR').includes(q)) : items;
            if (state.sortMode === 'price_asc') visible.sort((a, b) => getItemPrice(a) - getItemPrice(b));
            else if (state.sortMode === 'price_desc') visible.sort((a, b) => getItemPrice(b) - getItemPrice(a));
            else if (state.sortMode === 'name_asc') visible.sort((a, b) => getItemName(a).localeCompare(getItemName(b), 'tr'));
            else visible.sort((a, b) => getRecommendedScore(b) - getRecommendedScore(a));
            return visible;
        }

        async function loadMenu() {
            const response = await fetch(`/api/public/menu?table_hint=${encodeURIComponent(tableHint)}`);
            const data = await response.json();
            state.menu = getVisibleMenu(data.menu || {});
            state.portionStock = data.portion_stock || {};
            state.categories = Object.keys(state.menu);
            state.activeCategory = state.categories[0] || null;
            const itemCount = Object.values(state.menu).reduce((sum, items) => sum + items.length, 0);
            el.itemCountBadge.textContent = `${itemCount} ürün`;
            renderCategoryTabs();
            renderRecommendations();
            renderMenu();
            if (isBrowseMode) setStatus('Menü hazır', true);
        }

        async function loadPolicy() {
            if (isOnlineMode || isBrowseMode) return;
            try {
                const response = await fetch('/api/public/policy');
                const data = await response.json();
                if (data && data.success) {
                    state.policy = {
                        verify_mode: data.verify_mode || 'hybrid',
                        verify_required: !!data.verify_required,
                        allow_dynamic_qr: !!data.allow_dynamic_qr,
                        allow_nfc: !!data.allow_nfc
                    };
                }
            } catch (e) { }
            applyPolicyToUi();
            if (tokenFromUrl) verifyDynamicQr();
        }

        function applyPolicyToUi() {
            document.getElementById('qrRow').style.display = state.policy.allow_dynamic_qr ? 'flex' : 'none';
            document.getElementById('nfcRow').style.display = state.policy.allow_nfc ? 'flex' : 'none';
            el.btnReadNfc.style.display = state.policy.allow_nfc ? 'block' : 'none';
            if (!state.policy.verify_required) setStatus('Sipariş hazır', true);
            else setStatus('Doğrulama bekleniyor');
        }

        function renderCategoryTabs() {
            if (!state.categories.length) {
                el.catTabs.innerHTML = '';
                return;
            }
            el.catTabs.innerHTML = state.categories.map(cat => {
                const active = cat === state.activeCategory ? 'active' : '';
                return `<button class="tab ${active}" onclick="selectCategory('${escapeJs(cat)}')">${escapeHtml(cat)}</button>`;
            }).join('');
        }

        window.selectCategory = function (cat) {
            state.activeCategory = cat;
            renderCategoryTabs();
            renderRecommendations();
            renderMenu();
        };

        function renderRecommendations() {
            const allItems = Object.values(state.menu).flat().filter(item => isBrowseMode || !isSoldOutItem(item));
            if (!allItems.length) {
                el.recoRow.innerHTML = '';
                return;
            }
            const topItems = allItems.slice().sort((a, b) => getRecommendedScore(b) - getRecommendedScore(a)).slice(0, 8);
            el.recoRow.innerHTML = topItems.map(item => {
                const name = getItemName(item);
                const price = getItemPrice(item);
                if (isBrowseMode) {
                    return `<button class="reco-chip" onclick="jumpToItem('${escapeJs(name)}')">${escapeHtml(name)}</button>`;
                }
                return `<button class="reco-chip" onclick="addToCart('${escapeJs(name)}', ${price})">${escapeHtml(name)}</button>`;
            }).join('');
        }

        window.jumpToItem = function (name) {
            for (const cat of state.categories) {
                if ((state.menu[cat] || []).some(item => getItemName(item) === name)) {
                    selectCategory(cat);
                    break;
                }
            }
        };

        function renderMenu() {
            if (!state.activeCategory || !state.menu[state.activeCategory]) {
                el.categoryTitle.textContent = 'Menü';
                el.categoryCount.textContent = '';
                el.menuRoot.innerHTML = '<div class="empty">Menü bulunamadı.</div>';
                return;
            }
            const items = getVisibleItemsForCategory(state.activeCategory);
            el.categoryTitle.textContent = state.activeCategory;
            el.categoryCount.textContent = `${items.length} ürün`;
            if (!items.length) {
                el.menuRoot.innerHTML = '<div class="empty">Filtreye uygun ürün bulunamadı.</div>';
                return;
            }
            const color = getCategoryColor(state.activeCategory);
            el.menuRoot.innerHTML = items.map(item => {
                const name = getItemName(item);
                const price = getItemPrice(item);
                const imageUrl = getItemImageUrl(item);
                const fallback = escapeHtml(getInitials(name));
                const note = categoryNotes[state.activeCategory] || 'Liva seçkisi';
                const stock = getPortionStock(name);
                const tracked = !!(stock && stock.tracked);
                const remaining = tracked ? Number(stock.kalan || 0) : null;
                const soldOut = tracked && remaining <= 0;
                const stockHtml = tracked
                    ? `<span class="stock-pill ${soldOut ? 'empty' : (remaining <= 5 ? 'low' : '')}">${soldOut ? 'Tükendi' : 'Kalan: ' + formatPortionAmount(remaining)}</span>`
                    : '';
                const action = isBrowseMode
                    ? ''
                    : `<button class="btn btn-main" ${soldOut ? 'disabled' : ''} onclick="addToCart('${escapeJs(name)}', ${price})">${soldOut ? 'Yok' : '+'}</button>`;
                return `
                    <article class="item ${soldOut ? 'sold-out' : ''}" data-name="${escapeHtml(name)}">
                        <div class="item-visual" style="--item-color:${color}">
                            ${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.parentElement.textContent='${fallback}'">` : fallback}
                        </div>
                        <div class="item-title">
                            <h3>${escapeHtml(name)}</h3>
                            <div class="price">${price.toFixed(2)} TL</div>
                            <div class="item-note">${escapeHtml(note)}</div>
                            ${stockHtml}
                        </div>
                        ${action}
                    </article>`;
            }).join('');
        }

        window.addToCart = function (name, price) {
            const stock = getPortionStock(name);
            if (stock && stock.tracked) {
                const remaining = Number(stock.kalan || 0);
                const stockName = getPortionStockName(name);
                const requestedUnits = getPortionUnits(name);
                if (remaining <= 0) {
                    setStatus(`${stock.urun || stockName} tükendi`);
                    return;
                }
                if (getCartQtyForName(name) + requestedUnits > remaining + 0.001) {
                    setStatus(`${stock.urun || stockName} için sadece ${formatPortionAmount(remaining)} porsiyon kaldı`);
                    return;
                }
            }
            const key = `${name}__${price}`;
            if (!state.cart[key]) state.cart[key] = { urun: name, fiyat: price, adet: 0 };
            state.cart[key].adet += 1;
            renderCart();
        };

        window.removeFromCart = function (key) {
            if (!state.cart[key]) return;
            state.cart[key].adet -= 1;
            if (state.cart[key].adet <= 0) delete state.cart[key];
            renderCart();
        };

        function renderCart() {
            if (isBrowseMode) return;
            const entries = Object.entries(state.cart);
            if (!entries.length) {
                el.cartRoot.innerHTML = '<div class="empty">Sepet boş.</div>';
                el.cartTotal.innerHTML = '<span>Toplam</span><span>0.00 TL</span>';
                return;
            }
            let total = 0;
            el.cartRoot.innerHTML = entries.map(([key, item]) => {
                const line = Number(item.fiyat) * Number(item.adet);
                total += line;
                return `
                    <div class="cart-row">
                        <strong>${escapeHtml(item.urun)}</strong>
                        <span>${item.adet} x ${Number(item.fiyat).toFixed(2)}</span>
                        <button class="btn btn-danger" onclick="removeFromCart('${escapeJs(key)}')">-</button>
                    </div>`;
            }).join('');
            el.cartTotal.innerHTML = `<span>Toplam</span><span>${total.toFixed(2)} TL</span>`;
        }

        function canSendCart() {
            const required = {};
            for (const item of Object.values(state.cart)) {
                const stockName = getPortionStockName(item.urun);
                required[stockName] = (required[stockName] || 0) + getPortionUnits(item.urun, item.adet);
            }
            for (const [stockName, adet] of Object.entries(required)) {
                const stock = getPortionStock(stockName);
                if (!stock || !stock.tracked) continue;
                const remaining = Number(stock.kalan || 0);
                if (remaining <= 0) {
                    setStatus(`${stock.urun || stockName} tükendi`);
                    return false;
                }
                if (adet > remaining + 0.001) {
                    setStatus(`${stock.urun || stockName} için sadece ${formatPortionAmount(remaining)} porsiyon kaldı`);
                    return false;
                }
            }
            return true;
        }

        async function verifyDynamicQr() {
            const qrToken = el.qrTokenInput.value.trim();
            if (!qrToken) {
                setStatus('QR token gerekli');
                return false;
            }
            const response = await fetch('/api/public/session/verify-dynamic-qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_token: qrToken, table_hint: tableHint, device_fingerprint: fingerprint() })
            });
            const data = await response.json();
            if (!data.success) {
                setStatus(data.error || 'QR doğrulama başarısız');
                return false;
            }
            state.sessionToken = data.session_token;
            state.tableName = data.table_name;
            state.verified = true;
            localStorage.setItem('public_session_token', state.sessionToken);
            el.tableInfo.textContent = `Masa ${state.tableName}`;
            el.tableToken.textContent = state.tableName.slice(0, 3).toUpperCase();
            setStatus('QR doğrulandı', true);
            return true;
        }

        async function verifyNfc() {
            const nfcUid = el.nfcUidInput.value.trim();
            if (!nfcUid) {
                setStatus('NFC UID gerekli');
                return false;
            }
            const response = await fetch('/api/public/session/verify-nfc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table_hint: tableHint, nfc_uid: nfcUid, device_fingerprint: fingerprint() })
            });
            const data = await response.json();
            if (!data.success) {
                setStatus(data.error || 'NFC doğrulama başarısız');
                return false;
            }
            state.sessionToken = data.session_token;
            state.tableName = data.table_name;
            state.verified = true;
            localStorage.setItem('public_session_token', state.sessionToken);
            el.tableInfo.textContent = `Masa ${state.tableName}`;
            el.tableToken.textContent = state.tableName.slice(0, 3).toUpperCase();
            setStatus('NFC doğrulandı', true);
            return true;
        }

        async function readNfcFromDevice() {
            if (!('NDEFReader' in window)) {
                setStatus('Bu cihaz NFC desteklemiyor');
                return;
            }
            try {
                const reader = new NDEFReader();
                await reader.scan();
                setStatus('NFC bekleniyor');
                reader.onreading = (event) => {
                    const serial = event.serialNumber || '';
                    if (serial) {
                        el.nfcUidInput.value = serial;
                        setStatus('NFC okundu', true);
                    } else {
                        setStatus('NFC seri no okunamadı');
                    }
                };
            } catch (e) {
                setStatus('NFC okuma başlatılamadı');
            }
        }

        async function placeTableOrder() {
            const items = Object.values(state.cart);
            if (!items.length) {
                setStatus('Sepet boş');
                return;
            }
            if (!canSendCart()) return;
            if (state.policy.verify_required && !state.sessionToken) {
                let ok = false;
                if (state.policy.allow_dynamic_qr && el.qrTokenInput.value.trim()) ok = await verifyDynamicQr();
                else if (state.policy.allow_nfc && el.nfcUidInput.value.trim()) ok = await verifyNfc();
                else if (state.policy.allow_dynamic_qr) ok = await verifyDynamicQr();
                else if (state.policy.allow_nfc) ok = await verifyNfc();
                if (!ok) return;
            }
            el.btnOrder.disabled = true;
            el.btnOrder.textContent = 'Gönderiliyor';
            try {
                const response = await fetch('/api/public/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_token: state.sessionToken, table_name: state.tableName || tableHint, items })
                });
                const data = await response.json();
                if (!data.success) {
                    setStatus(data.error || 'Sipariş başarısız');
                    return;
                }
                state.portionStock = data.portion_stock || state.portionStock;
                recordOrderPrefs(items);
                state.cart = {};
                renderRecommendations();
                renderMenu();
                renderCart();
                setStatus('Sipariş mutfağa iletildi', true);
            } finally {
                el.btnOrder.disabled = false;
                el.btnOrder.textContent = 'Siparişi gönder';
            }
        }

        async function placeOnlineOrder() {
            const items = Object.values(state.cart);
            if (!items.length) {
                setStatus('Sepet boş');
                return;
            }
            if (!canSendCart()) return;
            const musteri_adi = document.getElementById('onlineAd').value.trim();
            const telefon = document.getElementById('onlineTel').value.trim();
            const adres = document.getElementById('onlineAdres').value.trim();
            const not_bilgisi = document.getElementById('onlineNot').value.trim();
            if (!musteri_adi) {
                setStatus('Ad Soyad zorunlu');
                return;
            }
            if (!telefon || telefon.replace(/\D/g, '').length < 10) {
                setStatus('Geçerli telefon girin');
                return;
            }
            if (!adres) {
                setStatus('Adres zorunlu');
                return;
            }

            el.btnOrder.disabled = true;
            el.btnOrder.textContent = 'Gönderiliyor';
            try {
                const response = await fetch('/api/online/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ musteri_adi, telefon, adres, not: not_bilgisi, odeme_tipi: state.odeme_tipi, items })
                });
                const data = await response.json();
                if (!data.success) {
                    setStatus(data.error || 'Sipariş gönderilemedi');
                    return;
                }
                state.portionStock = data.portion_stock || state.portionStock;
                recordOrderPrefs(items);
                document.getElementById('successSub').textContent = state.odeme_tipi === 'kart'
                    ? 'Kurye POS cihazıyla gelecektir.'
                    : 'Nakit ödeme seçildi.';
                document.getElementById('successScreen').style.display = 'block';
                document.getElementById('orderPanel').style.display = 'none';
                state.cart = {};
                renderRecommendations();
                renderMenu();
            } finally {
                el.btnOrder.disabled = false;
                el.btnOrder.textContent = 'Siparişi gönder';
            }
        }

        function recordOrderPrefs(items) {
            for (const item of items) {
                const name = item.urun;
                state.orderPrefs[name] = Number(state.orderPrefs[name] || 0) + Number(item.adet || 1);
            }
            localStorage.setItem('menu_order_prefs', JSON.stringify(state.orderPrefs));
        }

        window.resetAfterOrder = function () {
            document.getElementById('successScreen').style.display = 'none';
            document.getElementById('orderPanel').style.display = 'block';
            renderCart();
        };

        el.btnVerify.addEventListener('click', verifyDynamicQr);
        el.btnVerifyNfc.addEventListener('click', verifyNfc);
        el.btnReadNfc.addEventListener('click', readNfcFromDevice);
        el.searchInput.addEventListener('input', (event) => {
            state.searchQuery = (event.target.value || '').trim();
            renderMenu();
        });
        el.sortSelect.addEventListener('change', (event) => {
            state.sortMode = event.target.value || 'recommended';
            renderMenu();
        });
        el.btnOrder.addEventListener('click', () => isOnlineMode ? placeOnlineOrder() : placeTableOrder());

        initMode();
        loadPolicy();
        loadMenu().catch(() => setStatus('Menü yüklenemedi'));
        renderCart();
    </script>
</body>

</html>
